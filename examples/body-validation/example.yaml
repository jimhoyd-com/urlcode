id: body-validation
description: Declarative JSON body validation with JSON Schema 2020-12 request.body.<METHOD>.schema (local $defs, nullable types, anyOf), a named schema file with relative $refs shared by two routes, per-method body rules for GET and POST on one path, and parameter uuid and pattern checks, with no code.
tags: [request, body, per-method, named-schemas, schema-file, ref, get, post, validation, schema, json-schema, "2020-12", json, parameters, uuid, pattern, "422"]
complexity: intermediate
capabilities: [enabled, methods, parameters, request.body, respond]
targets: {self-hosted: compatible, aws: compatible, vercel: compatible, cloudflare: compatible, static: refused}
routes: 7
files: [urlcode.yaml, schemas/lead.json, schemas/contact-point.yaml, tests/requests.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project .
    - urlcode test --project .
    - urlcode audit --project . --expect-routes 7
behavior:
  - POST /todos with a valid JSON body answers 201; a body that breaks the schema answers 422 with the declared paths that failed; malformed JSON answers 400; a wrong media type answers 415
  - POST /contacts uses $schema 2020-12, a local $defs reference, a [string, null] type and anyOf; an absent required phone answers 422 while an explicit null is accepted
  - /requests serves GET and POST on one path with per-method body rules; GET with a body answers 413 (maxBytes 0), POST without a body answers 400 and one that breaks the schema 422
  - POST /leads and /referrals name one schema, lead, loaded from schemas/lead.json whose relative $refs to contact-point.yaml (the whole file and its $defs/source) are bundled offline at load; both answer the same 422 for the same invalid body
  - a path id that is not a uuid, or a slug that does not match the declared pattern, answers 400
