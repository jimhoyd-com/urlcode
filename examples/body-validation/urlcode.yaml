version: "1"
# Named schemas: declared once, named by any route (and by an mcp tool's inputSchema). lead is an
# independently authored file whose relative $refs are read offline and bundled at load.
schemas:
  lead: {file: schemas/lead.json}
routes:
  /todos:
    methods: [POST]
    request:
      body:
        POST:
          maxBytes: 4096
          contentTypes: [application/json]
          format: json
          required: true
          schema:
            type: object
            required: [title]
            additionalProperties: false
            properties:
              title: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, maxLength: 2000}
              completed: {type: boolean}
    respond:
      status: 201
      json: {ok: true}
  /todos/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    respond:
      json: {ok: true}
  /tags:
    parameters:
      - name: slug
        in: query
        required: true
        schema: {type: string, pattern: "^[a-z0-9-]+$", maxLength: 32}
    respond:
      json: {ok: true}
  /contacts:
    methods: [POST]
    request:
      body:
        POST:
          maxBytes: 4096
          contentTypes: [application/json]
          format: json
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            $defs:
              email: {type: string, format: email}
            type: object
            required: [name, email, phone]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1, maxLength: 100}
              email: {$ref: "#/$defs/email"}
              phone: {type: [string, "null"], maxLength: 32}
              callAt: {type: string, format: date-time}
              channel:
                anyOf:
                  - {const: email}
                  - {const: phone}
    respond:
      status: 201
      json: {ok: true}
  # GET and POST on one path, each with its own body rules: GET takes no body, POST needs a valid JSON one.
  /requests:
    methods: [GET, POST]
    request:
      body:
        GET: {maxBytes: 0}
        POST:
          maxBytes: 4096
          contentTypes: [application/json]
          format: json
          required: true
          schema:
            type: object
            required: [title]
            additionalProperties: false
            properties:
              title: {type: string, minLength: 1, maxLength: 200}
    respond:
      json: {ok: true}
  # Two routes naming one schema: the same validator, the same 422, one OpenAPI component.
  /leads:
    methods: [POST]
    request:
      body:
        POST: {format: json, contentTypes: [application/json], required: true, maxBytes: 4096, schema: lead}
    respond:
      status: 201
      json: {ok: true}
  /referrals:
    methods: [POST]
    request:
      body:
        POST: {format: json, contentTypes: [application/json], required: true, maxBytes: 4096, schema: lead}
    respond:
      status: 201
      json: {ok: true}
