# yaml-language-server: $schema=https://raw.githubusercontent.com/jimhoyd-com/urlcode/45b354b83efcc38883700a06ec29186128854f7b/schemas/urlcode.schema.json
version: "1"
dynamicLinks: true
routes:
  /r/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    link:
      collection: links
      code: {from: path, name: code}
  /about:
    respond:
      text: Links are stored separately from this YAML.
