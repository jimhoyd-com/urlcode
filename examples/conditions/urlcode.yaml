version: "1"
routes:
  /campaign:
    conditional:
      cases:
        - match: {query: {source: newsletter}}
          redirect: {url: https://example.test/newsletter, status: 307}
        - match: {query: {source: partner}}
          respond: {json: {campaign: partner}}
      fallback:
        respond: {text: Choose a campaign}
  /beta:
    match:
      headers: {x-beta-user: "true"}
      cookies: {bucket: beta}
    respond: {text: beta preview}
  /host:
    match: {host: conditions.example.test}
    respond: {text: trusted origin}
  /limited:
    # The only case matches GET, so HEAD falls through to 404 by design; the
    # fixtures assert that 404, and audit lists this waiver with its reason.
    coveredElsewhere:
      HEAD: "Deliberately unmatched: the only case requires GET, and tests/requests.json asserts HEAD's 404."
    conditional:
      cases:
        - match: {method: GET}
          respond: {text: get only}
