version: '1'
extensions:
  demo:
    version: '1'
    config:
      label: hello
  auth:
    version: '1'
    config: {}
routes:
  /demo/*:
    extension: demo
    methods: [GET, HEAD, POST]
  /private:
    respond:
      text: private
    policies:
      extensions:
        demo:
          role: member
  /account:
    respond:
      text: account
    auth:
      role: member
