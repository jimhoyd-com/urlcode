id: create-webhook-endpoint
title: Create a webhook endpoint
prompt: |
  Create POST /hooks/deploy that accepts a JSON body of at most 16 KiB with
  a string "ref" field and answers 202 with {"queued":true,"ref":<ref>}.
  Reject other content types and malformed JSON before any code runs.
rubric:
  - id: native-functionality
    description: The declared handler is the native one the request calls for; nothing that YAML can express is written in JavaScript.
  - id: valid-yaml
    description: urlcode.yaml parses as YAML 1.2 JSON-compatible data with a version and routes.
  - id: no-unsupported-fields
    description: The project loads against the schema; no field the contract does not define.
  - id: no-unnecessary-javascript
    description: No functions or middleware unless the request needs code.
  - id: no-boundary-violations
    description: Generated code imports only relative project modules; no Node built-ins, packages, fetch, process or filesystem access, and no grants written into the project.
  - id: tests-written
    description: tests/requests.json covers every route the request adds.
  - id: validation-run
    description: The agent ran urlcode validate or urlcode test before finishing.
  - id: provider-limits-respected
    description: Nothing outside the portable subset (proxy, signals, conditional, link, extension) unless the request asks for it.
expect:
  handlers:
    /hooks/deploy: function
  javascript: true
