id: authenticated-endpoint
title: Authenticated endpoint
description: >
  One public and one bearer-protected endpoint. There is almost no idea here:
  the two response bodies. Everything else (token comparison, challenge
  header, method handling) is plumbing, which makes this the floor of the
  benchmark.
prompt: |
  Build a tiny service with a public and a protected endpoint.

  - `GET /api/public` returns `{"service":"demo","public":true}`.
  - `GET /api/me` requires `Authorization: Bearer <token>` where the token
    equals the `API_TOKEN` environment variable. Compare in constant time. A
    missing or wrong token is a 401 with `WWW-Authenticate: Bearer realm="demo"`.
    A valid token returns `{"user":"service-account","scopes":["read"]}`.
  - Responses from `/api/me` must carry `Cache-Control: no-store`.
  - Only GET and HEAD are served on both paths; other methods are 405 with an
    `Allow` header. Unknown paths are 404.
required:
  - GET /api/public returns the public body without a token
  - GET /api/me without a token is a 401 with the Bearer challenge
  - GET /api/me with a wrong token is a 401
  - GET /api/me with the right token returns the account body with Cache-Control no-store
  - HEAD /api/me with the right token is a 200 with an empty body
  - POST /api/me is a 405
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
environment:
  API_TOKEN: benchmark-api-token
