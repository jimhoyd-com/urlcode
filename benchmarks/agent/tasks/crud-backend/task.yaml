id: crud-backend
title: CRUD backend
description: >
  A notes resource with the four verbs, a validated record shape and every
  edge status. Persistence is out of scope (nothing is read back after a
  write), so the idea is the record rules and the seed; method dispatch,
  body handling and status codes are plumbing.
prompt: |
  Build a CRUD backend for notes. Two notes exist to begin with:

  | id | title | body |
  |---|---|---|
  | 1 | Shopping | milk, bread |
  | 2 | Ideas | benchmark the plumbing |

  A note is `{"id","title","body"}`. `title` is a string of 1 to 120
  characters and `body` a string of at most 2000 characters; both are
  required and no other fields are allowed.

  - `GET /notes` lists notes as a JSON array in id order.
  - `GET /notes/{id}` returns one note. `id` is a positive integer (else 400);
    unknown ids are 404.
  - `POST /notes` creates a note from a JSON body and returns 201 with the
    note, assigning the next id (3 at first).
  - `PUT /notes/{id}` replaces a note and returns 200 with it; 404 when unknown.
  - `DELETE /notes/{id}` returns 204 with no body; 404 when unknown.
  - Invalid bodies are 422 as `{"errors":[...]}` with the messages
    `title must be 1-120 characters`, `body must be at most 2000 characters`
    and `unknown field <name>` as applicable. A non-JSON content type is 415,
    malformed JSON is 400.
  - PATCH is a 405 with an `Allow` header. Durable storage comes later; it is
    fine to serve the seed on every request.
required:
  - GET /notes lists both seed notes
  - GET /notes/2 returns the second note; /notes/9 is 404; /notes/x is 400
  - POST /notes with a valid note is a 201 with id 3
  - POST /notes with an empty title and an extra field is a 422 with both messages
  - PUT /notes/1 with a valid note returns it with id 1; PUT /notes/9 is a 404
  - DELETE /notes/1 is a 204; DELETE /notes/9 is a 404
  - PATCH /notes/1 is a 405
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
