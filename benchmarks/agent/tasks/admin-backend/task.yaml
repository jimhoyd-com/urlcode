id: admin-backend
title: Admin backend
description: >
  An operator-only area behind HTTP Basic authentication: a dashboard page,
  a stats endpoint, a user list and one action. The idea is the stats, the
  user table and the action; Basic auth, the challenge, page serving and
  routing are plumbing.
prompt: |
  Build the admin area for an internal tool. Everything under `/admin/` is
  protected by HTTP Basic authentication against the `ADMIN_USER` and
  `ADMIN_PASSWORD` environment variables; a missing or wrong credential is a
  401 with `WWW-Authenticate: Basic realm="admin"`. Compare in constant time.

  - `GET /admin/` serves `public/admin.html` (write it: a minimal HTML5 page
    with the title `Admin`) as `text/html; charset=utf-8`.
  - `GET /admin/api/stats` returns `{"users":3,"active":2}`.
  - `GET /admin/api/users` returns the user table as a JSON array:

    | id | name | active |
    |---|---|---|
    | 1 | ada | true |
    | 2 | grace | true |
    | 3 | linus | false |

  - `POST /admin/api/users/{id}/disable` returns 200 with the user record
    with `active` set to `false`; unknown ids are 404, a non-integer id is 400.
    Applying the change durably comes later.
  - Other methods on these paths are 405 with an `Allow` header; paths
    outside the admin area are 404.
required:
  - GET /admin/ without credentials is a 401 with the Basic challenge
  - GET /admin/ with wrong credentials is a 401
  - GET /admin/ with the right credentials is a 200 HTML page
  - GET /admin/api/stats and /admin/api/users return the JSON with credentials
  - POST /admin/api/users/2/disable returns grace with active false
  - POST /admin/api/users/9/disable is a 404; GET on it is a 405
  - GET /admin/api/stats without credentials is a 401
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
environment:
  ADMIN_USER: admin
  ADMIN_PASSWORD: benchmark-admin-password
