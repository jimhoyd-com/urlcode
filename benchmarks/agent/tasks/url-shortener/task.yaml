id: url-shortener
title: URL shortener
description: >
  A short-link resolver over a fixed link table plus a registration endpoint
  that validates what it is given. Persistence is out of scope (the acceptance
  suite never reads back what it registered), so the idea is the link table
  and the validation rules; the rest is routing, methods and body handling.
prompt: |
  Build a URL shortener for these links. The link table is fixed for now:

  | code | url |
  |---|---|
  | `docs` | `https://docs.example.com/` |
  | `blog` | `https://example.com/blog` |
  | `jobs` | `https://example.com/careers` |

  - `GET /r/{code}` redirects (302) to the link's URL. A code is 2 to 16
    lowercase letters, digits or dashes; anything else is a 400. An unknown
    well-formed code is a 404.
  - `GET /api/links/{code}` returns the record as JSON, `{"code":"docs","url":"https://docs.example.com/"}`,
    or 404 when unknown.
  - `POST /api/links` registers a new link from a JSON body `{"code","url"}`:
    the code must be well-formed and not already in the table (409 when it is),
    the URL must be `https:` with a host. A valid request returns 201 with the
    record as JSON. Invalid input returns 422 as `{"errors":[...]}` where the
    messages are exactly `invalid code`, `code already exists` and
    `url must be an https URL` as applicable. A non-JSON body is a 415; a
    malformed JSON body is a 400. Storing the new link is not required yet.
  - `/health` returns `{"ok":true}`.
required:
  - GET /r/docs is a 302 to https://docs.example.com/
  - GET /r/nope is a 404; GET /r/Not-Valid is a 400
  - GET /api/links/blog returns the record; unknown is a 404
  - POST /api/links with a valid record is a 201 echoing the record
  - POST /api/links with an existing code is a 422 naming code already exists
  - POST /api/links with a bad URL is a 422 naming url must be an https URL
  - POST /api/links with text/plain is a 415; with malformed JSON a 400
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
