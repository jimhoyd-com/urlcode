id: json-api
title: Small JSON API
description: >
  A read-only catalog API: a list with a validated filter, a record by
  integer id, and the usual 400/404/405 edges. The idea is the catalog; input
  validation and routing are plumbing.
prompt: |
  Build a small JSON API over this product catalog:

  | id | name | category | price |
  |---|---|---|---|
  | 1 | Notebook | stationery | 4.5 |
  | 2 | Fountain pen | stationery | 32 |
  | 3 | Desk lamp | lighting | 58 |

  - `GET /api/products` returns the list as a JSON array of
    `{"id","name","category","price"}` objects in id order. An optional
    `category` query parameter filters it; it must be `stationery` or
    `lighting`, anything else is a 400.
  - `GET /api/products/{id}` returns one product; `id` must be a positive
    integer (else 400) and an unknown id is a 404.
  - `GET /api/health` returns `{"ok":true}`.
  - The API is read-only: POST, PUT, PATCH and DELETE are 405 with an `Allow`
    header. Unknown paths are 404.
  - Every JSON response is served as `application/json`.
required:
  - GET /api/products returns all three products in id order
  - GET /api/products?category=lighting returns only the lamp
  - GET /api/products?category=toys is a 400
  - GET /api/products/2 returns the pen; /api/products/9 is a 404; /api/products/x is a 400
  - POST /api/products is a 405 with Allow GET, HEAD
  - GET /api/health returns {"ok":true}
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
