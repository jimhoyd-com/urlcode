id: static-site-api
title: Static site plus API
description: >
  A small marketing site with a JSON endpoint beside it: pages, an asset
  directory with caching, and one API route. The idea is the page content
  and the API body; serving files, caching headers and routing are plumbing.
prompt: |
  Build a small static site with an API endpoint beside it.

  - `GET /` serves `public/index.html` (write it: a minimal HTML5 page with
    the title `Acme`), as `text/html; charset=utf-8`.
  - `GET /about` serves `public/about.html` (a minimal HTML5 page with the
    title `About Acme`), also `text/html; charset=utf-8`.
  - `GET /assets/*` serves files under `public/assets/` with
    `Cache-Control: public, max-age=3600`. Create `public/assets/site.css`
    containing exactly `body{font-family:system-ui}` followed by a newline; it
    is served as `text/css; charset=utf-8`. A missing asset is a 404.
  - `GET /api/version` returns `{"name":"acme-site","version":"1.0.0"}` as
    JSON.
  - Only GET and HEAD are served; other methods are 405 with an `Allow`
    header. `/index.html` and unknown paths are 404: the pages are reachable
    only at their clean URLs.
required:
  - GET / is a 200 text/html; charset=utf-8 page
  - GET /about is a 200 text/html; charset=utf-8 page
  - GET /assets/site.css returns the stylesheet with the one-hour cache header
  - GET /assets/missing.css is a 404
  - GET /api/version returns the version JSON
  - POST / is a 405; GET /index.html is a 404
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
