id: webhook-receiver
title: Webhook receiver
description: >
  An inbound webhook endpoint: a shared-token check, a JSON body contract and
  an acknowledgement. The idea is the acknowledgement shape; the token check,
  method and body handling are plumbing.
prompt: |
  Build a webhook receiver for two upstream sources, `github` and `stripe`.

  - `POST /hooks/{source}` accepts JSON events. `source` must be one of the
    two names; anything else is a 404.
  - Every call must carry the shared secret in an `X-Webhook-Token` header,
    compared against the `WEBHOOK_TOKEN` environment variable. A missing or
    wrong token is a 401. Compare without leaking timing.
  - The body must be JSON (`application/json`; other types are 415, a
    malformed body is 400) and must be an object with a string `event`
    field; otherwise 422 with `{"errors":["event is required"]}`.
  - A valid event is acknowledged with 202 and
    `{"received":true,"source":"github","event":"push"}` (the source and event
    from the request). Processing is out of scope for now.
  - GET on the hook path is a 405 with an `Allow` header.
  - `/health` returns `{"ok":true}`.
required:
  - POST /hooks/github with the token and {"event":"push"} is a 202 acknowledgement
  - POST /hooks/stripe with the token and {"event":"invoice.paid"} is a 202 acknowledgement
  - POST /hooks/github without a token, or with a wrong one, is a 401
  - POST /hooks/other is a 404
  - POST /hooks/github with text/plain is a 415; malformed JSON is a 400
  - POST /hooks/github with {} is a 422 naming event is required
  - GET /hooks/github is a 405 with Allow POST
acceptance:
  fixture: acceptance/requests.json
  note: acceptance/README.md
environment:
  WEBHOOK_TOKEN: benchmark-webhook-token
