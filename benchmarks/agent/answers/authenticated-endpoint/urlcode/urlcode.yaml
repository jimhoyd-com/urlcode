version: "1"
routes:
  /api/public:
    respond: {json: {service: demo, public: true}}
  /api/me:
    env:
      API_TOKEN: {env: API_TOKEN}
    middleware:
      - source: middleware/bearer.mjs
    respond: {json: {user: service-account, scopes: [read]}}
    response:
      headers:
        Cache-Control: no-store
