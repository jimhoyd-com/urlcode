version: "1"
routes:
  /downloads/report:
    download:
      file: files/report.csv
      filename: quarterly-report.csv
      contentType: text/csv
      cacheControl: no-store
  /downloads/guide:
    download:
      file: files/guide.txt
      filename: getting-started.txt
      contentType: text/plain
  /public/*:
    static:
      directory: files/public
      cacheControl: public, max-age=3600
