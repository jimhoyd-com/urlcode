version: "1"
routes:
  /admin/:
    env:
      ADMIN_USER: {env: ADMIN_USER}
      ADMIN_PASSWORD: {env: ADMIN_PASSWORD}
    middleware:
      - source: middleware/basic.mjs
    page: {file: public/admin.html}
  /admin/api/stats:
    env:
      ADMIN_USER: {env: ADMIN_USER}
      ADMIN_PASSWORD: {env: ADMIN_PASSWORD}
    middleware:
      - source: middleware/basic.mjs
    respond: {json: {users: 3, active: 2}}
  /admin/api/users:
    env:
      ADMIN_USER: {env: ADMIN_USER}
      ADMIN_PASSWORD: {env: ADMIN_PASSWORD}
    middleware:
      - source: middleware/basic.mjs
    function:
      source: functions/users.mjs
      export: list
  /admin/api/users/{id}/disable:
    methods: [POST]
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 16}
    env:
      ADMIN_USER: {env: ADMIN_USER}
      ADMIN_PASSWORD: {env: ADMIN_PASSWORD}
    middleware:
      - source: middleware/basic.mjs
    function:
      source: functions/users.mjs
      export: disable
      args:
        id: {from: path, name: id}
