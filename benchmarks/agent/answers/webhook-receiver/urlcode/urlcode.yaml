version: "1"
routes:
  /hooks/{source}:
    methods: [POST]
    parameters:
      - name: source
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 32}
    request:
      body:
        required: true
        maxBytes: 65536
        contentTypes: [application/json]
        format: json
    env:
      WEBHOOK_TOKEN: {env: WEBHOOK_TOKEN}
    middleware:
      - source: middleware/token.mjs
    function:
      source: functions/receive.mjs
      args:
        source: {from: path, name: source}
  /health:
    respond: {json: {ok: true}}
