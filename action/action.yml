name: URLCode project checks
description: Install a URLCode site exactly as pinned, check its add-ons, validate, test and audit it, and comment a route-inventory diff on pull requests.
author: jimhoyd-com
branding:
  icon: check-circle
  color: blue
inputs:
  site:
    description: Directory holding the site's package.json, package-lock.json and host.mjs, relative to the workspace. The route project is always <site>/app.
    default: '.'
  host-file:
    description: Operator host relative to the site (usually host.mjs). When set, validate and test activate the installed extensions through it; the workflow must provide the secrets it reads (for example through env). PROJECT_SHA256 is computed from the checked-out project for this run only. Empty checks declared extensions statically against their installed schemas and skips test and audit when the project declares extensions.
    default: ''
  node-version:
    description: Node.js version passed to actions/setup-node.
    default: '26'
  expect-routes:
    description: Expected configured route count for `audit --expect-routes`. Empty skips the count check.
    default: ''
  allow-empty-project:
    description: Permit only the intentional `no-active-routes` audit result. Use for a newly initialized bare site; remove after adding its first active route.
    default: 'false'
  compliance:
    description: Compliance profile for the audit, `baseline`, `strict`, `privacy` or `none`.
    default: baseline
  compliance-rules:
    description: Absolute path to an operator rules module outside the project, passed as `--compliance-rules`.
    default: ''
  compliance-warn:
    description: Report compliance findings without failing the audit (`--compliance-warn`).
    default: 'false'
  origin:
    description: Public origin of the deployment under review, passed as `--origin` to validate, test and audit.
    default: ''
  route-diff:
    description: On pull_request events, compare the route inventory with the base branch and keep one sticky comment up to date.
    default: 'true'
outputs:
  route-diff:
    description: Path of the Markdown route diff written on pull requests, empty otherwise.
    value: ${{ steps.diff.outputs.file }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install exactly what the site pins
      shell: bash
      working-directory: ${{ inputs.site }}
      run: |
        set -euo pipefail
        # package-lock.json pins the runtime and every add-on by integrity; no install script ever runs.
        [ -f package-lock.json ] || { echo "::error::${PWD}/package-lock.json is missing; run npm install in the site and commit the lockfile"; exit 1; }
        npm ci --ignore-scripts --no-audit --no-fund
        [ -f node_modules/@jimhoyd/urlcode/dist/cli.js ] || { echo "::error::package.json does not depend on @jimhoyd/urlcode"; exit 1; }
        echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Check add-ons against the runtime's pins
      shell: bash
      working-directory: ${{ inputs.site }}
      run: |
        set -euo pipefail
        urlcode extensions list --strict
        urlcode artifacts list --strict
    - name: Prepare the host
      id: host
      shell: bash
      working-directory: ${{ inputs.site }}
      env:
        HOST_FILE: ${{ inputs.host-file }}
      run: |
        set -euo pipefail
        extensions="$(node -e 'const y=require("yaml");const d=y.parse(require("fs").readFileSync("app/urlcode.yaml","utf8"))||{};process.stdout.write(String(Object.keys(d.extensions||{}).length))' 2>/dev/null || echo 0)"
        if [ -n "$HOST_FILE" ]; then
          # This CI run only: the revision of the checked-out project. Production keeps its reviewed, explicit pin.
          echo "PROJECT_SHA256=$(node --input-type=module -e 'import {inspectExtensionRevision} from "@jimhoyd/urlcode/extensions"; process.stdout.write(await inspectExtensionRevision("app"))')" >> "$GITHUB_ENV"
          echo "args=--host-file $HOST_FILE" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"
        elif [ "$extensions" != 0 ]; then
          echo "::notice::app/urlcode.yaml declares extensions and no host-file is set: validate checks them statically; test and audit need host-file"
          echo "args=" >> "$GITHUB_OUTPUT"; echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "args=" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Validate
      shell: bash
      working-directory: ${{ inputs.site }}
      env:
        ORIGIN: ${{ inputs.origin }}
        HOST_ARGS: ${{ steps.host.outputs.args }}
      run: urlcode validate --project app $HOST_ARGS ${ORIGIN:+--origin "$ORIGIN"}
    - name: Test
      if: steps.host.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.site }}
      env:
        ORIGIN: ${{ inputs.origin }}
        HOST_ARGS: ${{ steps.host.outputs.args }}
      run: urlcode test --project app $HOST_ARGS ${ORIGIN:+--origin "$ORIGIN"}
    - name: Audit
      if: steps.host.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.site }}
      env:
        HOST_ARGS: ${{ steps.host.outputs.args }}
        ORIGIN: ${{ inputs.origin }}
        EXPECT: ${{ inputs.expect-routes }}
        ALLOW_EMPTY_PROJECT: ${{ inputs.allow-empty-project }}
        COMPLIANCE: ${{ inputs.compliance }}
        RULES: ${{ inputs.compliance-rules }}
        WARN: ${{ inputs.compliance-warn }}
      run: |
        set -euo pipefail
        args=(audit --project app $HOST_ARGS)
        [ -n "$ORIGIN" ] && args+=(--origin "$ORIGIN")
        [ -n "$EXPECT" ] && args+=(--expect-routes "$EXPECT")
        if [ "$COMPLIANCE" != none ] || [ -n "$RULES" ]; then
          args+=(--compliance "$COMPLIANCE")
          [ -n "$RULES" ] && args+=(--compliance-rules "$RULES")
          [ "$WARN" = true ] && args+=(--compliance-warn)
        fi
        set +e
        output="$(urlcode "${args[@]}")"
        status=$?
        set -e
        printf '%s\n' "$output"
        if [ "$ALLOW_EMPTY_PROJECT" = true ] && [ "$status" -eq 1 ] && node -e '
          const report=JSON.parse(process.argv[1].trim().split("\\n").at(-1));
          process.exit(report.ready === false && Array.isArray(report.notReadyReasons) && report.notReadyReasons.length === 1 && report.notReadyReasons[0] === "no-active-routes" ? 0 : 1);
        ' "$output"; then
          echo '::notice::The project has no active routes yet; audit will be required after its first route is added.'
          exit 0
        fi
        exit "$status"
    - name: Route diff against the base branch
      id: diff
      if: inputs.route-diff == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        PROJECT: ${{ inputs.site }}/app
        ORIGIN: ${{ inputs.origin }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/urlcode-route-diff"; mkdir -p "$out"
        base="$out/base"
        if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" || ! git worktree add --detach "$base" "$BASE_SHA"; then
          echo "::notice::The base ref $BASE_SHA is not available in this checkout; skipping the route diff"; exit 0
        fi
        trap 'git worktree remove --force "$base"' EXIT
        if [ ! -f "$base/$PROJECT/urlcode.yaml" ]; then echo "::notice::No urlcode.yaml at the base ref; skipping the route diff"; exit 0; fi
        # The head runtime reads both trees, so the diff shows YAML changes, not runtime changes.
        if ! urlcode routes --project "$base/$PROJECT" ${ORIGIN:+--origin "$ORIGIN"} > "$out/base.json"; then
          echo "::notice::The base ref does not load with this runtime; skipping the route diff"; exit 0
        fi
        urlcode routes --project "$PROJECT" ${ORIGIN:+--origin "$ORIGIN"} --compare "$out/base.json" --format markdown > "$out/diff.md"
        cat "$out/diff.md"
        echo "file=$out/diff.md" >> "$GITHUB_OUTPUT"
    - name: Update the pull request comment
      if: steps.diff.outputs.file != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DIFF_FILE: ${{ steps.diff.outputs.file }}
        PROJECT: ${{ inputs.site }}/app
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: node "$GITHUB_ACTION_PATH/comment.mjs"
