version: "1"
extensions:
  # Provider settings (secret, database, enabled endpoints) belong to the operator's host.mjs and data/, not here.
  auth: {version: "1", config: {}}
  store:
    version: "1"
    config:
      collections:
        # Review is an application permission, not a sign-in fact: one record per reviewer, keyed by the opaque
        # Better Auth user id. It has no mount; the operator maintains it (npm run setup).
        reviewers:
          membership: true
          key: userId
          schema:
            type: object
            additionalProperties: false
            required: [userId]
            properties:
              userId: {type: string, maxLength: 128}
        requests:
          mount: /api/requests
          ownership: owner
          # A JSON Schema 2020-12 record schema: value shape only, exactly as a request body schema.
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: {type: string, minLength: 1, maxLength: 120}
              details: {type: string, maxLength: 2000}
              status: {type: string, enum: [pending, approved]}
              reviewedAt: {type: string, maxLength: 32}
          # The store's own layer: what a create stores, and the properties only a transition changes.
          defaults: {details: "", status: pending}
          readOnlyProperties: [status, reviewedAt]
          filterable: [status]
          transitions:
            # The one business transition: a reviewer moves another user's pending request to approved.
            approve:
              from: {status: pending}
              set: {status: approved}
              stamp: {reviewedAt: now}
              by: others
              members: reviewers
              mount: /api/approvals
          # Reviewers list and read every owner's requests; owners see only their own on /api/requests.
          readers: {review: {mount: /api/review, members: reviewers}}
routes:
  /:
    description: The single-page frontend; it signs in through Better Auth's own client.
    page: {file: public/index.html}
  /assets/*:
    description: The frontend's script and stylesheet; app.js is built by npm run build.
    static: {directory: public/assets}
  /api/auth/*:
    description: Better Auth's own endpoints. @jimhoyd/urlcode-auth serves an exact allowlist; npm run inventory lists it.
    extension: auth
    methods: [GET, POST]
  /api/requests/*:
    description: The signed-in user's own requests. GET lists them (status=pending or approved filters) or reads one; POST creates a pending one.
    extension: store
    methods: [GET, POST]
    auth: true
  /api/approvals/*:
    description: POST /api/approvals/<id> approves another user's pending request; reviewers only.
    extension: store
    methods: [POST]
    auth: true
  /api/review/*:
    description: Every owner's requests, read-only, for reviewers only; GET /api/review?status=pending is the review queue.
    extension: store
    methods: [GET]
    auth: true
