<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private requests</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <main>
    <h1>Private requests</h1>
    <p id="status" role="status"></p>
    <form id="sign-in" hidden>
      <h2>Sign in</h2>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Sign in</button>
    </form>
    <section id="signed-in" hidden>
      <p>Signed in as <strong id="who"></strong> <button id="sign-out" type="button">Sign out</button> <button id="sign-out-all" type="button">Sign out everywhere</button></p>
      <form id="create">
        <h2>New request</h2>
        <label>Title <input name="title" maxlength="120" required></label>
        <label>Details <textarea name="details" maxlength="2000"></textarea></label>
        <button>Submit</button>
      </form>
      <h2>My requests</h2>
      <ul id="mine"></ul>
      <section id="review" hidden>
        <h2>Pending review</h2>
        <ul id="pending"></ul>
      </section>
    </section>
  </main>
</body>
</html>
