version: "1"
extensions:
  # Provider settings (secret, providers, session lifetime) belong to the operator's host.mjs and data/, not here.
  authjs: {version: "1", config: {}}
  store:
    version: "1"
    config:
      collections:
        # Review is an application permission, not a sign-in fact: one record per reviewer, keyed by the opaque
        # user id Auth.js puts in the session. It has no mount; the operator maintains it (npm run setup).
        reviewers:
          membership: true
          key: userId
          schema:
            type: object
            additionalProperties: false
            required: [userId]
            properties:
              userId: {type: string, maxLength: 128}
        requests:
          mount: /api/requests
          ownership: owner
          # A JSON Schema 2020-12 record schema; readOnly properties change only through a transition.
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: {type: string, minLength: 1, maxLength: 120}
              details: {type: string, maxLength: 2000, default: ""}
              status: {type: string, enum: [pending, approved], default: pending, readOnly: true}
              reviewedAt: {type: string, maxLength: 32, readOnly: true}
          filterable: [status]
          transitions:
            # The one business transition: a reviewer moves another user's pending request to approved.
            approve:
              from: {status: pending}
              set: {status: approved}
              stamp: {reviewedAt: now}
              by: others
              members: reviewers
              mount: /api/approvals
          # Reviewers list and read every owner's requests; owners see only their own on /api/requests.
          readers: {mount: /api/review, members: reviewers}
routes:
  /:
    description: The single-page frontend; it signs in through Auth.js's own endpoints.
    page: {file: public/index.html}
  /assets/*:
    description: The frontend's script and stylesheet; app.js is copied from client/ by npm run build.
    static: {directory: public/assets}
  /api/auth/*:
    description: Auth.js's own endpoints. @example/urlcode-authjs serves an exact allowlist of its actions.
    extension: authjs
    methods: [GET, POST]
    policies:
      # Auth.js has no rate limiter of its own; URLCode's throttle bounds sign-in attempts per client address.
      throttle: {quota: 60, window: 60}
  /api/requests/*:
    description: The signed-in user's own requests. GET lists them (status=pending or approved filters) or reads one; POST creates a pending one.
    extension: store
    methods: [GET, POST]
    auth: true
  /api/approvals/*:
    description: POST /api/approvals/<id> approves another user's pending request; reviewers only.
    extension: store
    methods: [POST]
    auth: true
  /api/review/*:
    description: Every owner's requests, read-only, for reviewers only; GET /api/review?status=pending is the review queue.
    extension: store
    methods: [GET]
    auth: true
