id: static-plus-api
description: A native static site (home page and an assets directory) next to one JSON endpoint declared with respond, with no project code.
tags: [static, site, page, html, assets, css, api, json, respond, cache-control, website, no-code]
complexity: intermediate
capabilities: [enabled, methods, page, respond, response.headers, static]
targets: {self-hosted: compatible, aws: compatible, vercel: compatible, cloudflare: refused, static: refused}
routes: 3
inputs:
  - name: pages
    file: public/index.html
    description: The home page and everything under public/assets.
  - name: answer
    file: urlcode.yaml
    description: The literal JSON /api/info answers; replace respond with a function only when the answer must be computed per request.
files: [urlcode.yaml, public/index.html, public/assets/index.html, public/assets/site.css, tests/requests.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project .
    - urlcode test --project .
    - urlcode audit --project . --expect-routes 3
behavior:
  - GET / answers the home page as text/html with Cache-Control no-cache
  - GET /assets/site.css answers text/css cached for one hour; /assets/ answers the directory index; missing files answer 404
  - GET /api/info answers 200 {"name":"Example site","version":"1"} with no-store from respond
  - every route is native, so the project also activates on the AWS and Vercel targets
