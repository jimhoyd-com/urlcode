id: store-approval
description: Approval workflow for signed-in users with no handler code, where requesters submit and withdraw their own requests, members of a reviewers list approve or reject other people's, a reviewer queue lists pending ones, and an approved request is locked.
tags: [approval, approvals, approve, reject, review, reviewer, reviewers, request, requests, submit, withdraw, workflow, queue, pending, locked, members, membership, readers, transitions, store, auth, extension, "409"]
complexity: advanced
capabilities: [enabled, extension, methods, policies.extensions]
targets: {self-hosted: conditional, cloudflare: refused, aws: refused, vercel: refused, static: refused}
routes: 4
services:
  - name: store extension
    description: The store (`urlcode extensions add store`) keeps the requests and the reviewers list in its SQLite database outside the project and runs every transition in one transaction.
  - name: auth extension
    description: "A principal-providing auth extension behind `auth: true` (`urlcode extensions add auth` in a real site); the store-booking README shows the stand-in bearer principal the bundled fixtures sign in with."
grants:
  - kind: extension
    description: The host registers the project revision it is pinned to. `--local-review` pins validate, test and audit to the current revision for one local run; serving needs the reviewed revision (--policy or PROJECT_SHA256).
  - kind: origin
    description: The canonical origin passed as --origin when serving; a local review uses http://localhost. Cross-origin writes are refused.
inputs:
  - name: reviewers
    file: urlcode.yaml
    description: Who may review is data, not YAML. The operator adds a principal id with `urlcode-store members add`; test and audit runs seed the reviewer `rita` from tests/seed.json into their throwaway database.
  - name: request
    file: urlcode.yaml
    description: The request's own properties (title and amount), the states, and which of them are editable and deletable.
files: [urlcode.yaml, tests/requests.json, tests/seed.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project . --host-file /operator/host.mjs --local-review
    - urlcode test --project . --host-file /operator/host.mjs --local-review
    - urlcode audit --project . --expect-routes 4 --host-file /operator/host.mjs --local-review
behavior:
  - POST /api/requests creates a draft owned by the caller; a body naming status, reviewedBy or reviewedAt answers 422, so nobody approves by writing it
  - the owner edits a draft, submits it (POST /api/requests/<id>/submit) and withdraws it back to draft; a pending, approved or rejected request answers PUT and PATCH with 409 record_locked
  - POST /api/approve/<id> and /api/reject/<id> are run by a reviewers member on another owner's pending request and stamp reviewedBy and reviewedAt; a non-member answers 403 membership_required and a reviewer's own request 403 own_record_refused
  - GET /api/review?status=pending is the reviewers' queue across owners with each request's _owner; anyone else answers 403, and an approved request can no longer be deleted
