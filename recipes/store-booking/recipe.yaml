id: store-booking
description: Members-only room booking in one-hour slots on the hour, where the store refuses an overlapping booking of the same room, a wrong length or an off-grid start, and a cancel transition frees the slot, with no handler code.
tags: [booking, bookings, book, schedule, scheduling, reservation, reservations, appointment, slot, slots, room, rooms, calendar, availability, overlap, intervals, hourly, staff, store, auth, extension, "409"]
complexity: advanced
capabilities: [enabled, extension, methods, policies.extensions]
targets: {self-hosted: conditional, cloudflare: refused, aws: refused, vercel: refused, static: refused}
routes: 1
services:
  - name: store extension
    description: The store (`urlcode extensions add store`) keeps the bookings and the staff list in its SQLite database outside the project and checks every write against the declared intervals.
  - name: auth extension
    description: "A principal-providing auth extension behind `auth: true` (`urlcode extensions add auth` in a real site); the README shows the stand-in bearer principal the bundled fixtures sign in with."
grants:
  - kind: extension
    description: The host registers the project revision it is pinned to. `--local-review` pins validate, test and audit to the current revision for one local run; serving needs the reviewed revision (--policy or PROJECT_SHA256).
  - kind: origin
    description: The canonical origin passed as --origin when serving; a local review uses http://localhost. Cross-origin writes are refused.
inputs:
  - name: rooms
    file: urlcode.yaml
    description: The bookable rooms (the room enum), the slot grid (intervals length, step and an optional origin) and the booking limits.
  - name: staff
    file: urlcode.yaml
    description: Who may book is data, not YAML. The operator adds a principal id with `urlcode-store members add`; test and audit runs seed `alice` and `bob` from tests/seed.json into their throwaway database.
files: [urlcode.yaml, tests/requests.json, tests/seed.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project . --host-file /operator/host.mjs --local-review
    - urlcode test --project . --host-file /operator/host.mjs --local-review
    - urlcode audit --project . --expect-routes 1 --host-file /operator/host.mjs --local-review
behavior:
  - POST /api/bookings from a staff member with a room and a one-hour UTC slot on the hour answers 201 with status booked, owned by the caller; a signed-in non-member answers 403 membership_required
  - a booking longer than an hour or starting off the hour answers 422, so a 12-hour booking is never stored
  - a booking that overlaps a booked booking of the same room, whoever owns it, answers 409 interval_conflict; an adjacent booking or another room is accepted
  - POST /api/bookings/<id>/cancel moves booked to cancelled and frees the slot for anyone to book; a body cannot set the status (422)
  - a request without a signed-in principal answers 401; a caller never sees or changes another owner's booking (404)
