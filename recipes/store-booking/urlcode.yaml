version: "1"
extensions:
  # Who is signed in: the operator-installed auth extension provides the principal `auth: true` needs.
  auth:
    version: "1"
    config: {}
  store:
    version: "1"
    config:
      collections:
        bookings:
          mount: /api/bookings
          # Each signed-in user creates, lists, changes and deletes only their own bookings.
          ownership: owner
          schema:
            type: object
            additionalProperties: false
            required: [room, start, end, status]
            properties:
              room: {type: string, enum: [atlas, borealis]}
              # UTC date-times on the hour: a booking is whole hours.
              start: {type: string, format: date-time, maxLength: 20, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$"}
              end: {type: string, format: date-time, maxLength: 20, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$"}
              status: {type: string, enum: [booked, cancelled]}
          defaults: {status: booked}
          # Only the cancel transition changes the status.
          readOnlyProperties: [status]
          # No two booked bookings of one room overlap, whoever owns them; a cancelled one frees its slot.
          intervals:
            start: start
            end: end
            within: [room]
            when: {status: booked}
          transitions:
            cancel: {from: {status: booked}, set: {status: cancelled}}
          maxRecords: 10000
          maxRecordsPerOwner: 100
routes:
  /api/bookings/*:
    description: Signed-in users book rooms by the hour; the store refuses an overlapping booking of the same room with 409.
    extension: store
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE]
    auth: true
