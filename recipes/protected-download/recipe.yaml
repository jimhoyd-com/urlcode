id: protected-download
description: Native attachment download that only the operator-installed auth extension (Better Auth) lets through.
tags: [download, attachment, protected, auth, authenticated, sign-in, session, file, private, extension, content-disposition, "401"]
complexity: advanced
capabilities: [download, enabled, extension, methods, policies.extensions]
targets: {self-hosted: conditional, aws: refused, vercel: refused, cloudflare: refused, static: refused}
routes: 2
services:
  - name: auth extension
    description: "The auth extension (`urlcode extensions add auth`, Better Auth) behind `auth: true`, mounted at /api/auth/* by routes/auth.yaml; the fixtures sign in through it as the account tests/seed.json declares."
grants:
  - kind: extension
    description: The host registers the project revision it is pinned to, which covers the attachment. `--local-review` pins validate, test and audit to the current revision for one local run; serving needs the reviewed revision (--policy or PROJECT_SHA256).
  - kind: origin
    description: The canonical origin passed as --origin when serving; a local review uses http://localhost.
inputs:
  - name: attachment
    file: files/report.txt
    description: Replace the placeholder and adjust filename and contentType in urlcode.yaml.
  - name: accounts
    file: tests/seed.json
    description: The synthetic account the fixtures sign in as; test and audit runs create it in their throwaway database.
files: [urlcode.yaml, routes/auth.yaml, files/report.txt, tests/requests.json, tests/seed.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project . --host-file /operator/host.mjs --local-review
    - urlcode test --project . --host-file /operator/host.mjs --local-review
    - urlcode audit --project . --expect-routes 2 --host-file /operator/host.mjs --local-review
behavior:
  - GET /downloads/report without a session answers 401
  - after a sign-in through POST /api/auth/sign-in/email, GET answers 200, Content-Disposition attachment and Cache-Control no-store
  - HEAD mirrors both cases with an empty body
  - no project code runs; the file is served natively and snapshotted at activation
