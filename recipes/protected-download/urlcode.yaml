version: "1"
# The auth mount, exactly as `urlcode extensions add auth` writes it: the fixtures sign in through it.
includes: [routes/auth.yaml]
extensions:
  # Who is signed in: the operator-installed auth extension (Better Auth) provides the principal `auth: true` needs.
  auth:
    version: "1"
    config: {}
routes:
  /downloads/report:
    description: Attachment served natively, only after the auth extension authorizes the caller.
    download:
      file: files/report.txt
      filename: quarterly-report.txt
      contentType: text/plain
      cacheControl: no-store
    auth: true
