id: authenticated-json-api
description: JSON endpoint protected by the operator-installed auth extension (Better Auth) through the route-level auth short form, whose function reads the signed-in user's id.
tags: [auth, authenticated, protected, signed-in, sign-in, session, better-auth, identity, json, api, function, extension, "401", private]
complexity: advanced
capabilities: [enabled, extension, function, methods, policies.extensions]
targets: {self-hosted: conditional, aws: refused, vercel: refused, cloudflare: refused, static: refused}
routes: 2
services:
  - name: auth extension
    description: "The auth extension (`urlcode extensions add auth`, Better Auth) behind `auth: true`, mounted at /api/auth/* by routes/auth.yaml; the fixtures sign in through it as the account tests/seed.json declares."
grants:
  - kind: extension
    description: The host registers the project revision it is pinned to. `--local-review` pins validate, test and audit to the current revision for one local run; serving needs the reviewed revision (--policy or PROJECT_SHA256).
  - kind: origin
    description: The canonical origin passed as --origin when serving; a local review uses http://localhost. Cross-origin writes are refused.
inputs:
  - name: requirement
    file: urlcode.yaml
    description: "auth: true, the whole requirement: roles, ownership and approvals are application data keyed by the user id."
  - name: handler
    file: functions/profile.mjs
    description: Replace the literal profile with real data for context.capabilities.auth.identity.userId; Authorization and Cookie never reach it.
  - name: accounts
    file: tests/seed.json
    description: The synthetic account the fixtures sign in as; test and audit runs create it in their throwaway database.
files: [urlcode.yaml, routes/auth.yaml, functions/profile.mjs, tests/requests.json, tests/seed.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode validate --local --project . --host-file /operator/host.mjs --local-review
    - urlcode test --project . --host-file /operator/host.mjs --local-review
    - urlcode audit --project . --expect-routes 2 --host-file /operator/host.mjs --local-review
behavior:
  - GET /api/profile without a session answers 401 from the extension before the function runs
  - after a sign-in through POST /api/auth/sign-in/email, GET answers 200 JSON with the signed-in user's id and Cache-Control no-store; after sign-out it is 401 again
  - HEAD mirrors both cases with an empty body; POST answers 405
  - the project declares the extension and the requirement; it never chooses or loads the implementing module
