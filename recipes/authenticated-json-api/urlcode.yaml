version: "1"
# The auth mount, exactly as `urlcode extensions add auth` writes it: the fixtures sign in through it.
includes: [routes/auth.yaml]
extensions:
  # Who is signed in: the operator-installed auth extension (Better Auth) provides the principal `auth: true` needs.
  auth:
    version: "1"
    config: {}
routes:
  /api/profile:
    description: JSON for signed-in callers; the operator-installed auth extension decides who is signed in.
    function:
      source: functions/profile.mjs
    auth: true
