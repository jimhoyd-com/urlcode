id: headless-auth-profile
description: Headless JSON API for registration, sign-in, a signed-in user's profile and sign-out, composed from the auth and store extensions with no handler code.
tags: [auth, headless, register, registration, signup, login, logout, session, profile, account, user, users, owner, ownership, json, api, extension, store, csrf, "401", "404"]
complexity: advanced
capabilities: [enabled, extension, methods, policies.extensions]
targets: {self-hosted: conditional, aws: conditional, vercel: conditional, cloudflare: refused, static: refused}
routes: 3
services:
  - name: auth extension
    description: The operator-installed auth extension with its ui, audit and mail requirements, registered in host.mjs; its operator service runs with registrationMode open. Auth itself runs only on the self-hosted Node runtime.
  - name: store extension
    description: The operator-installed store extension with a data directory outside the project, one server process per directory.
grants:
  - kind: extension
    description: The host registers the projectSha256 the operator reviewed (PROJECT_SHA256 or the --policy revision); every edit, including a new profile field, needs review and a new pin.
  - kind: origin
    description: The canonical origin passed as --origin; every write must carry it as Origin, with auth's session-bound CSRF token.
inputs:
  - name: profile fields
    file: urlcode.yaml
    description: The application's own profile fields under extensions.store.config.collections.profiles.fields; displayName and locale stay auth-owned.
  - name: registration mode
    file: urlcode.yaml
    description: extensions.auth.config.registration, which must equal the operator service's registrationMode.
files: [urlcode.yaml, tests/requests.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode extensions --project .
    - PROJECT_SHA256=<reviewed revision> urlcode validate --local --project . --host-file /operator/host.mjs --origin https://api.example.com
    - PROJECT_SHA256=<reviewed revision> urlcode test --project . --host-file /operator/host.mjs --origin https://api.example.com
behavior:
  - GET /account/csrf answers 200 {csrf} and binds it to a flow cookie; POST /account/register answers 201 {user, csrf} with a session cookie
  - POST /account/login answers 200 {user, csrf} with a new session; wrong credentials answer 401
  - GET /account/account and POST /account/profile read and update the auth-owned profile (displayName, locale) for the session only
  - GET, POST, PATCH, PUT and DELETE on /api/profile keep one application profile record per user; a second POST answers 409 owner_quota_exceeded
  - another user's profile record answers 404 for every method, exactly like a missing id
  - every signed-in write needs the site Origin and the X-CSRF-Token auth returned, otherwise 403
  - POST /account/logout answers 200 {signedOut true}; the old session then answers 401 everywhere
