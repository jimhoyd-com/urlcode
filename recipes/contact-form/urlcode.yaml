version: "1"
routes:
  /:
    description: The contact page, served natively from public/index.html.
    page:
      file: public/index.html
      cacheControl: no-cache
  /assets/*:
    description: The page's script, which posts the form as JSON to /contact.
    static:
      directory: public/assets
      cacheControl: no-cache
  /contact:
    description: Validate a JSON contact message declaratively and notify an operator-granted hook after the response.
    methods: [POST]
    request:
      body:
        POST:
          required: true
          maxBytes: 16384
          contentTypes: [application/json]
          format: json
          # The runtime checks the fields before anything runs and answers 422
          # when one breaks a rule; no function is needed for the check.
          schema:
            type: object
            required: [name, email, message]
            properties:
              name: {type: string, minLength: 1, maxLength: 100, pattern: "\\S"}
              email: {type: string, format: email}
              message: {type: string, minLength: 10, maxLength: 4000}
    respond:
      status: 202
      json: {accepted: true}
    signals:
      - url: https://hooks.example.com/contact
    response:
      headers:
        Cache-Control: no-store
