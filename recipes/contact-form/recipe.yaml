id: contact-form
description: Validate a JSON contact message with a declared body schema, answer 202 natively and notify an operator-granted hook with a fixed signal after the response.
tags: [contact, form, message, email, post, json, validation, schema, signal, notify, hook, egress, "422", no-code]
complexity: intermediate
capabilities: [enabled, methods, request.body, respond, response.headers, signals]
targets: {self-hosted: compatible, aws: refused, vercel: refused, cloudflare: refused, static: refused}
routes: 1
services:
  - name: hook endpoint
    description: An HTTPS endpoint you own that receives the fixed signal payload (route, method, status); replace https://hooks.example.com/contact.
grants:
  - kind: signals
    description: A revision-pinned operator policy granting the hook origin, generated with `urlcode permissions` and passed as --policy outside the project.
inputs:
  - name: signal url
    file: urlcode.yaml
    description: The hook that is notified after each response.
  - name: field rules
    file: urlcode.yaml
    description: The name, email and message limits in request.body.schema.
files: [urlcode.yaml, tests/requests.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode permissions --project . > /operator/contact-policy.json
    - urlcode validate --local --project . --policy /operator/contact-policy.json
    - urlcode test --project . --policy /operator/contact-policy.json
    - urlcode audit --project . --expect-routes 1 --policy /operator/contact-policy.json
behavior:
  - POST /contact with a valid name, email and message answers 202 {"accepted":true} from respond, with no project code
  - a missing or invalid field, or a body that is not an object, answers 422 from the runtime before the reply is built
  - form-encoded bodies answer 415 and GET answers 405
  - the signal carries route, method and status only, best effort; the message itself is never included
