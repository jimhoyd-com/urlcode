<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact</title><script type="module" src="/assets/contact.js"></script></head>
<body>
<h1>Contact</h1>
<form id="contact">
<p><label>Name <input name="name" required maxlength="100"></label></p>
<p><label>Email <input name="email" type="email" required></label></p>
<p><label>Message <textarea name="message" required minlength="10" maxlength="4000"></textarea></label></p>
<p><button>Send</button></p>
</form>
<p id="status" role="status"></p>
</body>
</html>
