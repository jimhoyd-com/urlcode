id: authenticated-handlers
description: Custom business handlers with verified session identity on ordinary YAML function routes; native auth supplies login, sessions and CSRF, with no application router or identity bridge.
tags: [authenticated, handlers, custom, business, identity, session, userid, principal, functions, native, auth, csrf, json]
complexity: intermediate
capabilities: [enabled, extension, function, methods, parameters, policies.extensions, request.body]
targets: {self-hosted: conditional, aws: refused, vercel: refused, cloudflare: refused, static: refused}
routes: 4
services:
  - name: auth extension
    description: Native auth with its ui, audit and mail dependencies, composed by the site's host; open registration must match the operator service.
grants:
  - kind: extension
    description: An explicitly reviewed project revision supplied by the operator; review YAML and trusted application modules before updating the pin.
  - kind: origin
    description: The canonical HTTPS site origin; writes carry it as Origin and send auth's session-bound X-CSRF-Token.
inputs:
  - name: application handlers
    file: functions/echo.mjs
    description: Replace the echo with unique application rules; sessionUserId(request) reads the verified session account id.
  - name: route contract
    file: urlcode.yaml
    description: Declare each application's path, methods, auth policy, parameter validation and JSON body bounds separately.
  - name: registration mode
    file: urlcode.yaml
    description: Keep extensions.auth.config.registration aligned with the operator service's reviewed registrationMode.
files: [urlcode.yaml, functions/me.mjs, functions/echo.mjs, tests/requests.json, README.md]
tests:
  fixtures: tests/requests.json
  commands:
    - urlcode extensions --project .
    - PROJECT_SHA256=<reviewed revision> urlcode validate --local --project . --host-file /operator/host.mjs --origin https://api.example.com
    - PROJECT_SHA256=<reviewed revision> urlcode test --project . --host-file /operator/host.mjs --origin https://api.example.com
    - PROJECT_SHA256=<reviewed revision> urlcode audit --project . --expect-routes 4 --host-file /operator/host.mjs --origin https://api.example.com
behavior:
  - GET /api/me returns the authorized session's opaque userId; HEAD has no body
  - POST /api/echo/{label} returns userId, the validated label and the parsed JSON body
  - native auth denies missing sessions and enforces write origin and CSRF before application code
  - client-supplied reserved identity headers cannot choose the acting user
  - the runtime rejects malformed, oversized and unsupported JSON bodies before invoking the function
  - login and logout stay on native /account endpoints; a revoked session cannot invoke a handler
