version: "1"
extensions:
  store:
    version: "1"
    config:
      collections:
        todos:
          mount: /api/todos
          # The record schema is a JSON Schema 2020-12 object schema, validated like a request body schema.
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: {type: string, minLength: 1, maxLength: 200}
              done: {type: boolean, default: false}
          maxRecords: 1000
          maxRecordBytes: 4096
routes:
  /api/todos/*:
    description: Create, read, update, delete and list todo records persisted by the operator-installed store extension.
    extension: store
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE]
