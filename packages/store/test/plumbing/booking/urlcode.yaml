# The host-transaction counterexample of recipes/store-booking (#902 item 6): the same API, served by the trusted
# `bookings` extension in bookings.mjs instead of a declared `intervals` constraint. A measurement fixture, not a recipe.
version: "1"
extensions:
  auth:
    version: "1"
    config: {}
  store:
    version: "1"
    config:
      collections:
        bookings:
          # A host transaction on an owned collection sees only one principal's records, so the overlap check could not
          # see other owners' bookings. The collection is shared, and the extension keeps and enforces the owner.
          mount: /internal/bookings
          schema:
            type: object
            additionalProperties: false
            required: [room, start, end, status, owner]
            properties:
              room: {type: string, enum: [atlas, borealis]}
              start: {type: string, format: date-time, maxLength: 20, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$"}
              end: {type: string, format: date-time, maxLength: 20, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$"}
              status: {type: string, enum: [booked, cancelled]}
              owner: {type: string, maxLength: 128}
          defaults: {status: booked}
          readOnlyProperties: [status]
          transitions:
            cancel: {from: {status: booked}, set: {status: cancelled}}
          maxRecords: 10000
  bookings:
    version: "1"
    config: {}
routes:
  # Every collection needs a store mount; nobody may reach this one.
  /internal/bookings/*:
    extension: store
    methods: [GET]
    enabled: false
  /api/bookings/*:
    description: Signed-in users book rooms by the hour; the bookings extension refuses an overlapping booking of the same room with 409.
    extension: bookings
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE]
    auth: true
