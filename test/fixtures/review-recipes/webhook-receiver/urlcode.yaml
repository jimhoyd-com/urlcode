version: "1"
routes:
  /webhook:
    description: Accept a bounded JSON event body that names its event type in a header.
    methods: [POST]
    request:
      body:
        required: true
        maxBytes: 65536
        contentTypes: [application/json]
        format: json
    function:
      source: functions/receive.mjs
    response:
      headers:
        Cache-Control: no-store
