openapi: 3.1.0
info:
  title: Petstore fixture
  version: 1.0.0
paths:
  /pets:
    get:
      summary: List pets
      responses:
        "200":
          description: Every pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
  /pets/{id}:
    get:
      summary: Read one pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One pet
          content:
            application/json:
              schema:
                $ref: "../schemas/pet.json"
components:
  schemas:
    Pets:
      type: array
      items:
        $ref: "../schemas/pet.json"
