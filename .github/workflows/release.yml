# Publication phase. It is triggered only by the immutable v* tag produced by
# the coordinator after full CI and a signed candidate succeed. Shared release
# contracts live in scripts/release.ts. Keep this filename for npm OIDC.
name: "Release — core: op — publish tagged candidate"
run-name: "Release — core publish ${{ github.ref_name }}"
on:
  push:
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: urlcode-publication
  cancel-in-progress: false
env:
  PACKAGE_NAME: "@jimhoyd/urlcode"
  PACKAGE_DIR: .
jobs:
  release:
    name: Promote candidate and publish core distribution channels
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          # No npm cache here: this job publishes with elevated, environment-scoped
          # credentials, and it must not restore a cache written by an earlier,
          # less-privileged workflow run (e.g. CI on a contributor's branch).
      - run: npm ci --ignore-scripts
      - name: 1. Confirm the immutable tag matches the release manifest
        id: version
        run: node scripts/release.ts identity
      - name: 2. Recheck exact green main commit and release state
        env: &a1
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts preflight
      - name: 3. Restore the signed candidate bytes (or the matching retry bytes)
        id: restore
        env: *a1
        run: node scripts/release.ts restore
      - name: 4. Retain the original release bytes for an immutable retry
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.restore.outputs.name }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
      - name: 5. Attest the promoted release bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/*
      # Require the separate-repository credential before a release can publish
      # anything, rather than silently leaving Homebrew on an older version.
      - name: 6. Require Homebrew tap credential
        if: vars.PUBLISH_NPM == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"
      - name: 7. Check out the Homebrew tap
        if: vars.PUBLISH_NPM == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jimhoyd-com/homebrew-urlcode
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The tap token must not sit in this checkout's stored git
          # credentials for the rest of the job; the one step that pushes
          # supplies it explicitly on the push command instead.
          persist-credentials: false
          path: .homebrew-tap
          fetch-depth: 1
      - name: 8. Publish to npm via trusted publishing
        if: vars.PUBLISH_NPM == 'true'
        env: *a1
        run: |-
          npm install --global --no-fund --no-audit npm@11.5.1
          npm run release:publish
      # The formula names the npm tarball, so synchronize only after that
      # immutable archive exists.
      - name: 9. Synchronize Homebrew formula
        if: vars.PUBLISH_NPM == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |-
          set -euo pipefail
          install -m 0644 candidate/urlcode.rb .homebrew-tap/Formula/urlcode.rb
          git -C .homebrew-tap diff --check
          git -C .homebrew-tap diff --quiet && exit 0
          git -C .homebrew-tap config user.name 'urlcode release bot'
          git -C .homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .homebrew-tap add Formula/urlcode.rb
          git -C .homebrew-tap commit -m "chore: update urlcode formula to $VERSION"
          # The tap token is supplied only here, on the one command that needs
          # it, rather than persisted in the checkout's git credentials for
          # the whole job.
          git -C .homebrew-tap push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jimhoyd-com/homebrew-urlcode.git" HEAD:main
      - name: 10. Publish the GitHub release
        env: *a1
        run: node scripts/release.ts github
      - name: 11. Publish or verify the matching GHCR image and channel
        if: vars.PUBLISH_CONTAINER == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIST_TAG: ${{ steps.version.outputs.dist }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Registry/auth failures must not be interpreted as an absent image.
          if docker manifest inspect "$image:$VERSION" > /tmp/manifest.json 2>/tmp/manifest-error; then
            docker pull "$image:$VERSION"
            actual=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image:$VERSION")
            test "$actual" = "$GITHUB_SHA"
          else
            grep -q 'manifest unknown' /tmp/manifest-error || { cat /tmp/manifest-error >&2; exit 1; }
            docker build -f packaging/container/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$image:$VERSION" .
            docker push "$image:$VERSION"
          fi
          # The shared preflight guards npm channel monotonicity. Check the container
          # channel independently, including artifacts-only releases.
          if docker manifest inspect "$image:$DIST_TAG" >/dev/null 2>/tmp/channel-error; then
            docker pull "$image:$DIST_TAG"
            prior=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image:$DIST_TAG")
            node --input-type=module -e 'import semver from "semver"; if (!semver.valid(process.argv[1]) || !semver.gte(process.argv[2], process.argv[1])) process.exit(1)' "$prior" "$VERSION"
          else
            grep -q 'manifest unknown' /tmp/channel-error || { cat /tmp/channel-error >&2; exit 1; }
          fi
          docker tag "$image:$VERSION" "$image:$DIST_TAG"
          docker push "$image:$DIST_TAG"
