# Shared release contracts live in scripts/release.ts. Keep this filename for npm OIDC.
name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: urlcode-publication
  cancel-in-progress: false
env:
  PACKAGE_NAME: "@jimhoyd/urlcode"
  PACKAGE_DIR: .
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate tag and manifest
        id: version
        run: node scripts/release.ts identity
      - name: Require exact green main commit and valid release state
        env: &a1
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts preflight
      - name: Promote verified candidate or restore original release bytes
        id: restore
        env: *a1
        run: node scripts/release.ts restore
      - name: Retain original release bytes
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.restore.outputs.name }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
      - name: Sign provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/*
      - name: Publish to npm via trusted publishing
        if: vars.PUBLISH_NPM == 'true'
        env: *a1
        run: |-
          npm install --global --no-fund --no-audit npm@11.5.1
          npm run release:publish
      - name: Publish the GitHub release
        env: *a1
        run: node scripts/release.ts github
      - name: Publish the container image to GHCR
        if: vars.PUBLISH_CONTAINER == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIST_TAG: ${{ steps.version.outputs.dist }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Registry/auth failures must not be interpreted as an absent image.
          if docker manifest inspect "$image:$VERSION" > /tmp/manifest.json 2>/tmp/manifest-error; then
            docker pull "$image:$VERSION"
            actual=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image:$VERSION")
            test "$actual" = "$GITHUB_SHA"
          else
            grep -q 'manifest unknown' /tmp/manifest-error || { cat /tmp/manifest-error >&2; exit 1; }
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$image:$VERSION" .
            docker push "$image:$VERSION"
          fi
          # The shared preflight guards npm channel monotonicity. Check the container
          # channel independently, including artifacts-only releases.
          if docker manifest inspect "$image:$DIST_TAG" >/dev/null 2>/tmp/channel-error; then
            docker pull "$image:$DIST_TAG"
            prior=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image:$DIST_TAG")
            node --input-type=module -e 'import semver from "semver"; if (!semver.valid(process.argv[1]) || !semver.gte(process.argv[2], process.argv[1])) process.exit(1)' "$prior" "$VERSION"
          else
            grep -q 'manifest unknown' /tmp/channel-error || { cat /tmp/channel-error >&2; exit 1; }
          fi
          docker tag "$image:$VERSION" "$image:$DIST_TAG"
          docker push "$image:$DIST_TAG"
