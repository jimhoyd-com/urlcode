# Starts a release: bumps every version declaration to the requested version and pushes the change as the
# `release/v<version>` branch. It never touches main (main only changes through a reviewed pull request); open the
# pull request from the branch, and merging it publishes the release (publish.yml). A pull request opened by a person
# runs CI normally, which one opened with this workflow's token would not.
name: Create release
run-name: Create release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z or X.Y.Z-alpha.N, newer than the current one
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-bump
  cancel-in-progress: false
jobs:
  bump:
    name: Bump every version and push the release branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Refuse a version that already has a branch or a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null; then echo "::error::release/v$VERSION already exists; open its pull request or delete the branch"; exit 1; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::v$VERSION is already released"; exit 1; fi
      - name: Bump every version declaration
        run: |-
          set -euo pipefail
          node scripts/release-bump.ts "$VERSION"
          # npm's own lockfile normalization (for example peer key order), so the pull request's install is a no-op.
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/release-bump.ts --check
      - name: Push release/v${{ inputs.version }}
        run: |-
          set -euo pipefail
          git switch -c "release/v$VERSION"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -am "release: v$VERSION"
          git push origin "release/v$VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release/v$VERSION?expand=1&title=release:+v$VERSION"
          echo "::notice::Open the release pull request: $url"
          printf '### Release v%s is ready for review\n\n[Open the pull request](%s). Merging it publishes v%s through the Publish release workflow.\n' "$VERSION" "$url" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
