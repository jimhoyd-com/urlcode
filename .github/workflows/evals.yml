name: evals
# The authoring evals against a real model, weekly and on demand. The job
# skips cleanly when no ANTHROPIC_API_KEY secret is configured, stores every
# run record as an artifact, posts the pass rate to the job summary and fails
# when the rate drops below benchmarks/agent/runs/baseline.json.
#
# A skipped run still concludes green, which in the Actions list is the same
# mark a real passing evaluation gets. So a skip says so in the job summary and
# uploads an `agent-benchmark-SKIPPED-<run id>` marker instead of a run-record
# artifact: no green result here should be read as evidence that a model was
# evaluated unless the `agent-benchmark-runs-<run id>` artifact exists.
# benchmarks/agent/README.md, "Scheduled evals", documents the variable, the
# secret, the cost and what a drop means.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      URLCODE_BENCHMARK_MODEL: ${{ vars.URLCODE_BENCHMARK_MODEL }}
    steps:
      - name: Check for a credential
        id: credential
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            {
              echo "## No model evaluation ran"
              echo
              echo "No \`ANTHROPIC_API_KEY\` is configured, so the evals were skipped."
              echo "This job concludes green because skipping is not a failure — **not**"
              echo "because any authoring eval passed. No model was called and no run"
              echo "record was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no credential; evals skipped"
            printf '{"skipped":true,"reason":"no ANTHROPIC_API_KEY configured","runId":"%s","date":"%s"}\n' \
              "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > evals-skipped.json
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.credential.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.credential.outputs.present == 'true'
      - name: Run the authoring evals
        if: steps.credential.outputs.present == 'true'
        # The runner exits 1 when any criterion fails; the gate below decides
        # whether that is a regression, so its exit code is not the job's.
        run: npm run benchmark:agent -- --evals --adapter anthropic | tee evals-output.jsonl || true
      - name: Store the run records
        if: steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-benchmark-runs-${{ github.run_id }}
          path: |
            benchmarks/agent/runs/
            evals-output.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Record that no evaluation ran
        if: steps.credential.outputs.present != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-benchmark-SKIPPED-${{ github.run_id }}
          path: evals-skipped.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare with the baseline
        if: steps.credential.outputs.present == 'true'
        run: node benchmarks/agent/gate.ts --log evals-output.jsonl --model "${URLCODE_BENCHMARK_MODEL:-default}"
