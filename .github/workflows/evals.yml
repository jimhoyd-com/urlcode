name: evals
# The authoring evals against a real model, weekly and on demand. The job
# skips cleanly when no ANTHROPIC_API_KEY secret is configured, stores every
# run record as an artifact, posts the pass rate to the job summary and fails
# when the rate drops below benchmarks/agent/runs/baseline.json.
# benchmarks/agent/README.md, "Scheduled evals", documents the variable, the
# secret, the cost and what a drop means.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      URLCODE_BENCHMARK_MODEL: ${{ vars.URLCODE_BENCHMARK_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for a credential
        id: credential
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no credential; evals skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "no credential; evals skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the authoring evals
        if: steps.credential.outputs.present == 'true'
        # The runner exits 1 when any criterion fails; the gate below decides
        # whether that is a regression, so its exit code is not the job's.
        run: npm run benchmark:agent -- --evals --adapter anthropic | tee evals-output.jsonl || true
      - name: Store the run records
        if: steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-benchmark-runs-${{ github.run_id }}
          path: |
            benchmarks/agent/runs/
            evals-output.jsonl
          if-no-files-found: error
      - name: Compare with the baseline
        if: steps.credential.outputs.present == 'true'
        run: node benchmarks/agent/gate.ts --log evals-output.jsonl --model "${URLCODE_BENCHMARK_MODEL:-default}"
