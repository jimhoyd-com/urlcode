name: "Release: train: op — publish signed safe recommendation"
on:
  workflow_dispatch:
    inputs:
      core_version: {description: Exact core version, required: true, type: string}
      bundle_release: {description: Exact extension-bundle release tag, required: true, type: string}
      bundle_commit: {description: Extension-bundle catalog source commit, required: true, type: string}
      artifact_release: {description: Exact artifact release tag, required: true, type: string}
      artifact_commit: {description: Artifact catalog source commit, required: true, type: string}
permissions: {contents: read}
jobs:
  tag:
    if: github.ref_type == 'branch'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Create immutable tag and dispatch its tag-bound publication
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          BUNDLE_RELEASE: ${{ inputs.bundle_release }}
          BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          ARTIFACT_RELEASE: ${{ inputs.artifact_release }}
          ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=ExperimentalWarning scripts/release-train.ts tag
  publish:
    if: github.ref_type == 'tag'
    environment: release
    concurrency:
      group: safe-release-train-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write, id-token: write, attestations: write, artifact-metadata: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Build and validate immutable recommendation metadata
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          BUNDLE_RELEASE: ${{ inputs.bundle_release }}
          BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          ARTIFACT_RELEASE: ${{ inputs.artifact_release }}
          ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
          OUTPUT: ${{ runner.temp }}/safe-release-train.json
        run: |-
          node --disable-warning=ExperimentalWarning scripts/release-train.ts build
          node --disable-warning=ExperimentalWarning scripts/release-train.ts validate
      - name: Attest safe recommendation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/safe-release-train.json
      - name: Publish immutable recommendation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/safe-release-train.json" --title "$GITHUB_REF_NAME" --verify-tag
