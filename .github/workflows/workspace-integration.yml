name: "Verify — workspace integration"
run-name: "Verify — workspace integration (${{ github.ref_name }})"
# An operator-triggered pre-release proof. It is intentionally separate from
# routine CI and does not publish, tag, or require the release environment.
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: workspace-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: "Workspace integration (${{ matrix.os }}, Node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:workspace-integration
