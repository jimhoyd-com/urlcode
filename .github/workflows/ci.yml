name: Verify — CI
run-name: ${{ github.event_name == 'schedule' && 'Verify — sweep' || github.event_name == 'workflow_dispatch' && 'Verify — release' || format('Verify — CI ({0})', github.ref_name) }}
on:
  # Main is verified by publish.yml, which calls this workflow once per push and
  # releases when the version on main has no tag yet; PRs get the feedback lane.
  pull_request:
  # If GitHub merge queue is enabled, its synthetic merge commit gets the
  # complete matrix before it can land. PRs retain the faster feedback lane.
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: The caller is about to release this commit, so run the complete matrix
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * *'
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; main's run gates a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Installs use `npm ci --ignore-scripts`: the root `prepare` script is the
# build, and a job that needs `dist/` runs `npm run build` itself, so a plain
# `npm ci` built everything twice. Jobs that never read `dist/` (docs,
# audit) skip the build entirely. `build-fidelity` keeps a plain `npm ci`,
# because the release packer and its determinism check start from the tree an
# ordinary install leaves.
jobs:
  # Which jobs and legs this run needs (docs/CI.md). A pull request or a push is
  # classified from its changed paths by dorny/paths-filter; everything else
  # (the release run publish.yml asks for, a dispatch, the merge queue and the
  # nightly sweep) is exact-commit coverage and is never classified. The
  # classification fails closed: a skipped or failed filter step (history git
  # cannot read, a bad SHA) and an empty diff leave every output at its full
  # value, and every consuming `if:` skips only on an explicit `docs` or `false`,
  # so a missing output runs the job rather than skipping it.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exact: ${{ inputs.release == true || (github.event_name != 'pull_request' && github.event_name != 'push') }}
      lane: ${{ steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.code == 'false' && 'docs' || 'full' }}
      core: ${{ !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.core == 'false') }}
      highImpact: ${{ !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.highImpact == 'false') }}
      extensionCode: ${{ !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.extensionCode == 'false') }}
      packages: ${{ steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.packages.outcome == 'success' && steps.packages.outputs.changes || '["audit","auth","store","mcp"]' }}
      os: ${{ (inputs.release == true || (github.event_name != 'pull_request' && github.event_name != 'push')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]' }}
      node: ${{ (inputs.release == true || (github.event_name != 'pull_request' && github.event_name != 'push')) && '["22","24","26"]' || '["24"]' }}
      # A high-impact pull request (#744) adds Windows Node 24 core shards.
      testOs: ${{ (inputs.release == true || (github.event_name != 'pull_request' && github.event_name != 'push')) && '["ubuntu-latest","macos-latest","windows-latest"]' || github.event_name == 'pull_request' && !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.highImpact == 'false') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]' }}
      # A pull request that changes extension code runs its extension suites on Windows Node 24 too (#824).
      packageOs: ${{ (inputs.release == true || (github.event_name != 'pull_request' && github.event_name != 'push')) && '["ubuntu-latest","macos-latest","windows-latest"]' || github.event_name == 'pull_request' && !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.extensionCode == 'false') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]' }}
      # The packed add-on integration: every OS before a release or on dispatch, Linux on a high-impact pull request.
      integration: ${{ inputs.release == true || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' && !(steps.lanes.outcome == 'success' && steps.lanes.outputs.any == 'true' && steps.lanes.outputs.highImpact == 'false') }}
      integrationOs: ${{ (inputs.release == true || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.release != true && (github.event_name == 'pull_request' || github.event_name == 'push')
        with:
          persist-credentials: false
          fetch-depth: 0
      # `token: ''` makes the filter read `git diff` of this checkout (the pull
      # request's merge commit against its base, or a push's before..after)
      # instead of the API, so it needs no pull-requests permission, which a
      # caller of this workflow does not grant. `some-with-excludes`: a path
      # matches a filter when one pattern includes it and no `!` pattern excludes it.
      - id: lanes
        if: inputs.release != true && (github.event_name == 'pull_request' || github.event_name == 'push')
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          predicate-quantifier: some-with-excludes
          filters: |
            any:
              - '**'
            # Anything but reviewed contributor prose. Skills, starters, recipes,
            # examples, schemas, manifests, workflows, shipped or agent-facing
            # package documents and unknown paths are code. Everything prose is
            # still checked by the always-run `docs` job.
            code:
              - '**'
              - '!docs/**/*.md'
              - '!{README,CONTRIBUTING,SECURITY,GOVERNANCE,CODE_OF_CONDUCT,AGENTS,ROADMAP}.md'
              - '!llms.txt'
              - '!llms-full.txt'
              - '!packages/*/{CONTRIBUTING,CODE_OF_CONDUCT,GOVERNANCE}.md'
            # Anything outside the extension packages can change the core archive,
            # its tests, the Action, the image or the reproducible build.
            core:
              - '**'
              - '!packages/{audit,auth,store,mcp}/**'
            extensionCode:
              - 'packages/{audit,auth,store,mcp}/**'
              - '!packages/*/{CONTRIBUTING,CODE_OF_CONDUCT,GOVERNANCE}.md'
            # Paths that once passed the Linux lane and failed on Windows or at
            # the packed add-on boundary during release coverage (#668, #669, #673, #744).
            highImpact:
              # Installer, upgrade and scaffolding.
              - 'packages/core/src/{addon-install,extensions-cli,init-with,scaffold,recipes}.ts'
              - 'packages/core/src/upgrade*'
              - 'scripts/create-extension*'
              - 'starters/**'
              # Package manifests and dependency wiring.
              - '**/package.json'
              - '**/package-lock.json'
              - 'packages/*/urlcode.json'
              - 'scripts/{workspaces,build-addon-manifest,check-workspace-links}.ts'
              # Release tooling.
              - 'scripts/{release-*,pack-addons,package-*,npm-command}.ts'
              # Integration, proofs and per-package fixture cleanup.
              - 'test/{addons,private-requests,authjs-provider,native-storage,ecosystem}.integration.ts'
              - 'proofs/**'
              - 'scripts/test-addons*'
              - 'packages/*/test/cleanup.ts'
              # Shared inputs fail closed: repository automation and any root file but prose.
              - '.github/**'
              - '*'
              - '!{README,CONTRIBUTING,SECURITY,GOVERNANCE,CODE_OF_CONDUCT,AGENTS,ROADMAP}.md'
              - '!llms.txt'
              - '!llms-full.txt'
      # The extension suites to run: a changed extension and every extension
      # that builds against it (`store` uses `audit`), or all of them when a
      # path outside the extensions changed. Its `changes` output is that list.
      - id: packages
        if: inputs.release != true && (github.event_name == 'pull_request' || github.event_name == 'push')
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          predicate-quantifier: some-with-excludes
          filters: |
            audit:
              - '**'
              - '!packages/{auth,store,mcp}/**'
            auth:
              - '**'
              - '!packages/{audit,store,mcp}/**'
            store:
              - '**'
              - '!packages/{auth,mcp}/**'
            mcp:
              - '**'
              - '!packages/{audit,auth,store}/**'
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:docs
  static:
    needs: plan
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      # typecheck resolves the package's own `@jimhoyd/urlcode/*` self-imports
      # through the `types` in its exports map, which point into dist/. No
      # workspace build step precedes lint/typecheck/check:code: none of them
      # read workspace output (workspace typecheck/build runs in
      # `workspace-verify` instead).
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      # Phase one of JS type-checking (allowJs/checkJs): build/release tooling
      # only (tsconfig.checkjs.json), not the 61 recipe/example .mjs files.
      - run: npm run typecheck:tooling
      # `npm run check` stays complete for local use, but in CI the
      # documentation checks it contains already ran in the always-run `docs`
      # job on this same commit, so this lane runs only the remainder.
      - run: npm run check:code
  # `npm test` alone, split into three `--test-shard` jobs per leg so it is off
  # the critical path of the ~6 minute serial Windows run. Each shard builds for
  # itself rather than sharing a dist/ artifact: the build is part of what the
  # per-Node/per-OS legs verify, and an artifact hop costs about what it saves.
  verify:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    strategy:
      fail-fast: false
      # Routine PR/main feedback is Linux Node 24; a high-impact pull request
      # adds Windows Node 24 shards. Exact-commit runs use every OS and Node.
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.testOs) }}
        node: ${{ fromJSON(needs.plan.outputs.node) }}
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Same command and flags as `npm test`, plus the shard.
      # Through npm so npm_execpath is set, as it is for `npm test`; some tests read it.
      - run: npm run test:shard -- --test-shard=${{ matrix.shard }}/3 test/*.test.ts
  # Everything that is not the sharded suite: starter/example tests, the
  # packed-archive smoke and the operational drills, on every leg of the plan.
  checks:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        node: ${{ fromJSON(needs.plan.outputs.node) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:examples:built
      - run: npm run test:package:built
      - run: node dist/scripts/operational-drills.js
  # Every other leg's `setup-node` installs whatever the newest patch of its
  # major is, so nothing actually exercises the documented package floor
  # (`engines`: `>=22.13.0` on core and every first-party extension,
  # CONTRIBUTING.md/docs/INSTALL.md) itself: a regression that only breaks on
  # 22.13.0, not on a newer 22.x, would ship undetected. This leg pins that
  # exact version and packs/installs the real core tarball (`package-smoke.ts`,
  # the same check `checks` runs on newer Node) plus builds every extension
  # package, so both the archive a consumer installs and the workspaces a
  # contributor builds are proven at the floor, not just asserted in prose.
  package-floor-smoke:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Node's TypeScript type-stripping (what every `scripts/*.ts` entry point
    # here relies on) is on by default only from 22.18.0; 22.13.0 still has
    # it, but needs this flag explicitly, or every `.ts` invocation below
    # fails closed with ERR_UNKNOWN_FILE_EXTENSION. The published package
    # itself never executes .ts (ships plain dist/*.js), so this only
    # affects this leg's own build/audit tooling, not what a consumer runs.
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # devEngines.runtime pins a stricter floor for contributors than
      # engines.node's published package floor this leg exists to prove; npm
      # enforces devEngines unconditionally on any invocation in a directory
      # with this package.json, including setup-node's own internal `npm
      # config get cache` below, so it must be stripped before that step
      # runs, not just before `npm ci`. This leg's checkout only, never a
      # contributor's own `npm ci`.
      - run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devEngines;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The full package-smoke `urlcode test` call (#645): at the literal
      # 22.13.0 floor, `res.strictContentLength = true` (http-response.ts)
      # asked Node's own ERR_HTTP_CONTENT_LENGTH_MISMATCH self-check to
      # revalidate a Content-Length this runtime had already measured
      # correctly, and Node 22.13.0-22.14.x's self-check is itself broken —
      # it throws from a byte-for-byte-correct response, deterministically,
      # even on a single request on a fresh connection (not readiness.ts's
      # shared keep-alive socket, which was the original suspect: a minimal
      # repro outside this codebase failed the same way with no connection
      # reuse involved). contentLengthEnforcementIsSafe (server.ts) now
      # turns that redundant Node self-check off only on that narrow,
      # confirmed-broken range, so the full check is safe to run here again.
      - run: npm run test:package:built
      - run: node scripts/workspaces.ts run build
  # `verify --workspace <pkg>` (typecheck, build, test) for the extension
  # packages, one package per job instead of all of them serially in one job.
  # `auth`'s own SQLite-backed suite alone was over half of the ~6-7 minute
  # serial windows-latest run; this puts it beside the others instead of after
  # them. Each job needs its own install and the root build, because a package
  # imports `@jimhoyd/urlcode`, the workspace-linked root package, through its
  # built `dist/`. A pull request that changes extension code also runs the
  # selected packages on Windows Node 24 (#824), as entries of this same
  # matrix, so `verify-complete` covers them without a separate job.
  workspace-verify:
    needs: plan
    if: needs.plan.outputs.lane != 'docs'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.packageOs) }}
        node: ${{ fromJSON(needs.plan.outputs.node) }}
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every add-on in dependency order (`store` imports `audit`'s built
      # declarations), so this package's typecheck and build can resolve them.
      - run: node scripts/workspaces.ts run build
      - run: npm run verify --workspace @jimhoyd/urlcode-${{ matrix.package }}
  # Cross-package checks that need every workspace package already built:
  # the publish audit and the integration suite (init --with <ext>, which
  # symlinks the compiled companion packages).
  workspace-integration:
    needs: [plan, workspace-verify]
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.integration != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.integrationOs) }}
        node: ['24']
    runs-on: ${{ matrix.os }}
    # Real npm installs of the packed runtime and every add-on, several sites per run; Windows is the slowest leg.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every add-on, in dependency order: the integration test packs each one.
      - run: node scripts/workspaces.ts run build
      - run: npm run audit:packages
      - run: npm run test:addons
      # The embedded Better Auth proof (#843): packs core and installs better-auth into a site copy.
      - run: npm run test:proof
      # The ecosystem conformance fixture (#841): packs core, installs zod and Hono into a site copy, serves it both ways.
      - run: npm run test:ecosystem
      # The same application with Auth.js, an independent provider package, in place of Better Auth (#841).
      - run: npm run test:proof:authjs
      # Owner choice (#1052): node:sqlite called directly from trusted routes, auth: true through Auth.js, no store or audit.
      - run: npm run test:proof:native
  # A really full filesystem (#902): `urlcode serve` with its data directory
  # (store, auth and audit) on a 16 MiB tmpfs that the harness fills to
  # ENOSPC, then frees. Linux only: it mounts a tmpfs with sudo, and PR CI is
  # Linux anyway. It runs in the full lane whatever changed, extension-only
  # diffs included, because store, auth, audit and core serving all meet here.
  # The harness refuses a filesystem larger than 64 MiB.
  disk-full:
    needs: plan
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every add-on, in dependency order: the site's host.mjs imports audit, auth and store from their dist/.
      - run: node scripts/workspaces.ts run build
      - run: sudo mkdir -p /mnt/urlcode-disk-full && sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs /mnt/urlcode-disk-full
      - run: npm run test:disk-full
        env:
          URLCODE_DISK_FULL_DIR: /mnt/urlcode-disk-full
  audit:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'

  action:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    # The site action cannot run against this repository from a site's pull
    # request; exercise it on a site built from the packed runtime and add-ons
    # so a broken action.yml fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/workspaces.ts run build
      # Every add-on descriptor matches its code, and dist/addon-catalog.json matches the descriptors (#721).
      - run: node scripts/build-addon-manifest.ts --check
      # Sites built from the packed runtime and add-ons, pinned by sha512 exactly as a release pins them.
      - run: node scripts/pack-addons.ts "$RUNNER_TEMP/packed" --site "$RUNNER_TEMP/site" --with store --example --ack store:public-write
      - run: node scripts/pack-addons.ts "$RUNNER_TEMP/packed-host" --site "$RUNNER_TEMP/host-site" --with mcp
      - name: Run the action on a site whose extensions are checked statically
        uses: ./action
        with:
          site: ${{ runner.temp }}/site
          compliance: baseline
          compliance-warn: true
          route-diff: false
      # mcp adds no routes, so this exercises host loading, the CI revision pin and activation without fixtures.
      - name: Run the action on a site through its host
        uses: ./action
        with:
          site: ${{ runner.temp }}/host-site
          host-file: host.mjs
          origin: https://site.example
          expect-routes: 0
          allow-empty-project: true
          compliance: baseline
          compliance-warn: true
          route-diff: false

  build-fidelity:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    # dist/ is never committed: prove the build is deterministic, so a release
    # can be reproduced from its tagged commit and compared file by file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's own toolchain: publish.yml builds with .node-version too.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ci:build-fidelity

  # Required check. A job skipped by its own `if:` reports success, and each one
  # skips only on an explicit `docs` lane or `false` from a successful plan, so a
  # failed plan, a failed or cancelled job, or a job skipped because a job it
  # needs failed, fails this gate.
  verify-complete:
    if: always()
    needs: [plan, docs, static, verify, checks, workspace-verify, workspace-integration, disk-full, audit, action, build-fidelity, container, package-floor-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every planned check succeeded
        if: needs.plan.result != 'success' || needs.docs.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'All planned checks passed'

  # Required check. The docs lane skips it: every prose path the plan admits is
  # outside the image's build context (.dockerignore) and none of the smoke
  # tests read one.
  container:
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.core != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f packaging/container/Dockerfile -t urlcode:test .
      - run: npm run ci:container-smoke
