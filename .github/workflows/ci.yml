name: CI — verify
on:
  # A branch in this repository would otherwise run twice for one commit: once
  # for the push and again for the pull request, with different concurrency
  # groups so neither cancels the other. That doubled every job and, with a
  # small concurrent-macOS allowance, was what left macOS jobs queueing.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      checks: ${{ steps.plan.outputs.checks }}
      workspacePackages: ${{ steps.plan.outputs.workspacePackages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      # A pull request carries base/head; a push carries before/after. Both are
      # empty for schedule and workflow_dispatch, and the classifier keeps
      # those full regardless, so release coverage cannot become a docs run.
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/ci-plan.ts "$BASE" "$HEAD"
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
  static:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run workspace:styles
      - run: npm run lint
      - run: npm run typecheck
      # `npm run check` stays complete for local use, but in CI the seven
      # documentation checks it contains already ran in the always-run `docs`
      # job on this same commit, so this lane runs only the remainder. The
      # sampled documentation checking is about two seconds; the point is not
      # to repeat work, not a meaningful wall-time saving.
      - run: npm run check:code
  # `npm test` alone, split into three `--test-shard` jobs per leg so it is off
  # the critical path of the ~6 minute serial Windows run. Each shard builds for
  # itself rather than sharing a dist/ artifact: the build is part of what the
  # per-Node/per-OS legs verify, and an artifact hop costs about what it saves.
  # Legs are per (os, node, shard); every one must pass for `verify-complete`.
  verify:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      # Linux covers every Node version; routine platform coverage uses Node 24.
      # Scheduled/manual runs retain the full OS x Node matrix for releases.
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same command and flags as `npm test`, plus the shard.
      # Through npm so npm_execpath is set, as it is for `npm test`; some tests read it.
      - run: npm run test:shard -- --test-shard=${{ matrix.shard }}/3 test/*.test.ts
  # Everything that is not the sharded suite: package smoke on every leg, and
  # on Ubuntu Node 24 (every leg on scheduled/manual runs) the starter and
  # example tests, the Cloudflare build, the route audit and the drills.
  checks:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.full
        shell: bash
        run: |
          set -e
          node dist/cli.js test --project starters/default
          node dist/cli.js test --project examples/assets
          node dist/cli.js test --project examples/cookbook
          node dist/cli.js test --project examples/vercel
          node dist/cli.js test --project examples/aws
          node dist/cli.js test --project examples/cloudflare
          node dist/cli.js build --target cloudflare --project examples/cloudflare --out examples/cloudflare/dist
          node dist/cli.js audit --project examples/cookbook --expect-routes 40
      - run: npm run test:package:built
      - if: matrix.full
        run: node dist/scripts/operational-drills.js
  # `verify --workspace <pkg>` (typecheck, build, test) for the five extension
  # packages, one package per job instead of the five run serially in one job.
  # `auth`'s own SQLite-backed suite alone was over half of the ~6-7 minute
  # serial windows-latest run; this puts it beside the others instead of after
  # them. Each job needs its own install and the root build, because a package
  # imports `@jimhoyd/urlcode`, the workspace-linked root package, through its
  # built `dist/`.
  workspace-verify:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.workspacePackages) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Shared runners (Windows in particular) have started the auth store
      # worker slowly (#339). Raises only the readiness budget, never lowers it.
      URLCODE_AUTH_STORE_STARTUP_MS: '60000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # `admin` imports `auth` and `ui`; `auth` and `forms` import `ui`. The
      # matrix carries each package's dependencies in build order (empty for
      # `ui` and `store`, which have none) so this job's own typecheck/build
      # can resolve them, the way the removed serial script did by ordering.
      - if: matrix.deps != ''
        shell: bash
        run: |
          set -euo pipefail
          for dep in ${{ matrix.deps }}; do npm run build --workspace @jimhoyd/urlcode-$dep; done
      - run: npm run verify --workspace @jimhoyd/urlcode-${{ matrix.package }}
  # Cross-package checks that need every workspace package already built:
  # the publish audit and the integration suite (init --with <ext>, which
  # symlinks the compiled companion packages). Kept out of `workspace-verify`
  # so that matrix stays one package per job; rebuilding four small packages
  # here is a few seconds, not the minutes their own test suites cost.
  workspace-integration:
    needs: [plan, workspace-verify]
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      # Linux covers every Node version; routine platform coverage uses Node 24.
      # Scheduled/manual runs retain the full OS × Node matrix for releases.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      URLCODE_AUTH_STORE_STARTUP_MS: '60000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every workspace package, not just the ones `test:workspace-integration`
      # symlinks: `audit:packages --all` also audits `forms`.
      - run: npm run build --workspace @jimhoyd/urlcode-ui --workspace @jimhoyd/urlcode-auth --workspace @jimhoyd/urlcode-admin --workspace @jimhoyd/urlcode-store --workspace @jimhoyd/urlcode-forms
      - run: npm run audit:packages
      - run: npm run test:workspace-integration
      # Real-browser check of the CRUD screen (#332), on the Chrome that the
      # Linux runner image already carries: no new action or download. One leg
      # only; it is a step in this job, not a new required check.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        env:
          URLCODE_REQUIRE_BROWSER: '1'
        run: npm run test:browser --workspace @jimhoyd/urlcode-ui
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'

  action:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    # The project action cannot run against this repository from a project's
    # pull request; exercise its steps against the cookbook with the packed
    # runtime so a broken action.yml fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          project: examples/cookbook
          runtime: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          expect-routes: 40
          compliance: baseline
          compliance-warn: true
          route-diff: false

  build-fidelity:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    # dist/ is never committed: prove the build is deterministic, so a release
    # can be reproduced from its tagged commit and compared file by file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # scripts/pack-sources.mjs is the operator reproducible-build path and
      # nothing else exercised it (#314). It needs a clean tree, so it runs
      # before the steps below that leave untracked directories. The output is
      # outside the checkout. About ten seconds; no new job.
      - name: pack-sources builds all six packages from this commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-sources.mjs --revision "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/pack-sources" --offline
          node -e "
            const fs=require('fs'),d=process.argv[1];
            const m=JSON.parse(fs.readFileSync(d+'/source-manifest.json','utf8'));
            const want=['@jimhoyd/urlcode','@jimhoyd/urlcode-ui','@jimhoyd/urlcode-auth','@jimhoyd/urlcode-admin','@jimhoyd/urlcode-store','@jimhoyd/urlcode-forms'];
            if(JSON.stringify(m.packages.map(p=>p.name))!==JSON.stringify(want))throw new Error('unexpected packages '+JSON.stringify(m.packages));
            for(const p of m.packages)if(!fs.existsSync(d+'/'+p.filename))throw new Error('missing '+p.filename);
          " "$RUNNER_TEMP/pack-sources"
      - run: npm run build && cp -r dist first && npm run build && diff -r first dist
      # The release re-uploads assets over an existing release, which is only
      # safe if the tarball a re-run produces is the one already published.
      - name: npm pack is byte-reproducible at this commit
        run: |
          set -euo pipefail
          mkdir -p a b
          npm pack --ignore-scripts --pack-destination a >/dev/null
          npm pack --ignore-scripts --pack-destination b >/dev/null
          sha256sum a/*.tgz b/*.tgz
          cmp a/*.tgz b/*.tgz

  verify-complete:
    # A skip is accepted only when the successful classifier required it.
    if: always()
    needs: [plan, docs, static, verify, checks, workspace-verify, workspace-integration, audit, action, build-fidelity, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - name: Every planned check succeeded
        env:
          CI_PLAN: ${{ needs.plan.outputs.lane }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.ts gate

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f packaging/container/Dockerfile -t urlcode:test .
      - name: Smoke test bundled recipe and TypeScript authoring
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=700 \
            --entrypoint sh urlcode:test -ec '
              node /opt/urlcode/dist/cli.js recipes add typescript --out /tmp/source
              node /opt/urlcode/dist/cli.js build-typescript --project /tmp/source --out /tmp/built
              node /opt/urlcode/dist/cli.js validate --project /tmp/built
            '
      - name: Smoke test container health and bare starter
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name urlcode -p 127.0.0.1:3000:3000 -v "$PWD/starters/default:/project:ro" urlcode:test
          trap 'docker logs urlcode; docker rm -f urlcode' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/_urlcode/ready; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/missing)" = 404
      - name: Smoke test isolated functions in constrained container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 -v "${{ github.workspace }}/examples/assets:/project:ro" urlcode:test test
