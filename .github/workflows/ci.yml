name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node src/cli.js test --project starters/redirects
      - run: node src/cli.js test --project starters/dynamic
      - run: npm run test:package
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t urlcode:test .
      - name: Smoke test container health and redirect
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name urlcode -p 127.0.0.1:3000:3000 -v "$PWD/starters/redirects:/project:ro" urlcode:test
          trap 'docker logs urlcode; docker rm -f urlcode' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/_urlcode/ready; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go)" = 302
      - name: Smoke test isolated functions in constrained container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 -v "${{ github.workspace }}/starters/dynamic:/project:ro" urlcode:test test
