name: verify
on:
  push:
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node src/cli.js test --project starters/default
      - run: node src/cli.js test --project examples/assets
      - run: node src/cli.js test --project examples/cookbook
      - run: node src/cli.js test --project examples/vercel
      - run: node src/cli.js audit --project examples/cookbook --expect-routes 17
      - run: npm run test:package
      - run: node scripts/operational-drills.js
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'
      # The live-link suite skips itself on a Node build without the patched
      # SQLite. At least one job must actually run it, or the skip hides failures.
      - name: Live-link tests must not be silently skipped on every build
        run: node -e "import('./src/sqlite-version.js').then(m=>{const ok=m.supportsConcurrentWal(process.versions.sqlite);console.log('sqlite',process.versions.sqlite,'live links',ok);process.exit(ok?0:1);})"
      - run: node --test test/links.test.js

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t urlcode:test .
      - name: Smoke test container health and redirect
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name urlcode -p 127.0.0.1:3000:3000 -v "$PWD/starters/default:/project:ro" urlcode:test
          trap 'docker logs urlcode; docker rm -f urlcode' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/_urlcode/ready; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go)" = 302
      - name: Smoke test isolated functions in constrained container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 -v "${{ github.workspace }}/examples/assets:/project:ro" urlcode:test test
      - name: Smoke test live links with an external writable store
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /state:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=700 \
            -v "$PWD/examples/live-links:/project:ro" --entrypoint sh urlcode:test -ec '
              node /opt/urlcode/src/cli.js links create --store /state/links.sqlite --code demo --destination https://example.com/demo
              node /opt/urlcode/src/cli.js test --link-store links=/state/links.sqlite
              node /opt/urlcode/src/cli.js audit --link-store links=/state/links.sqlite --expect-routes 2
            '
      - name: Disposable volume-full and recovery drill
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 768m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=700 \
            --tmpfs /state:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=700 \
            -v "$PWD/scripts:/opt/urlcode/scripts:ro" --entrypoint node urlcode:test \
            /opt/urlcode/scripts/operational-drills.js --disk-full-dir /state
