name: Verify — CI
run-name: ${{ github.event_name == 'schedule' && 'Verify — sweep' || github.event_name == 'workflow_dispatch' && 'Verify — release' || format('Verify — CI ({0})', github.ref_name) }}
on:
  # Main is verified by publish.yml, which calls this workflow once per push and
  # releases when the version on main has no tag yet; PRs get the feedback lane.
  pull_request:
  # If GitHub merge queue is enabled, its synthetic merge commit gets the
  # complete matrix before it can land. PRs retain the faster feedback lane.
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: The caller is about to release this commit, so run the complete matrix
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * *'
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; main's run gates a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Installs use `npm ci --ignore-scripts`: the root `prepare` script is the
# build, and a job that needs `dist/` runs `npm run build` itself, so a plain
# `npm ci` built everything twice. Jobs that never read `dist/` (docs,
# audit) skip the build entirely. `build-fidelity` keeps a plain `npm ci`,
# because the release packer and its determinism check start from the tree an
# ordinary install leaves.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      checks: ${{ steps.plan.outputs.checks }}
      workspacePackages: ${{ steps.plan.outputs.workspacePackages }}
      workspaceIntegration: ${{ steps.plan.outputs.workspaceIntegration }}
      workspaceIntegrationMatrix: ${{ steps.plan.outputs.workspaceIntegrationMatrix }}
      action: ${{ steps.plan.outputs.action }}
      buildFidelity: ${{ steps.plan.outputs.buildFidelity }}
      container: ${{ steps.plan.outputs.container }}
      coreChecks: ${{ steps.plan.outputs.coreChecks }}
      packageFloorSmoke: ${{ steps.plan.outputs.packageFloorSmoke }}
      # Diagnostics for #744's high-impact selection. Jobs consume it through
      # `shards`, `workspacePackages` and `workspaceIntegration*` above.
      highImpact: ${{ steps.plan.outputs.highImpact }}
      platformLegs: ${{ steps.plan.outputs.platformLegs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      # A pull request carries base/head; a push carries before/after. Both are
      # empty for schedule and workflow_dispatch, and the classifier keeps
      # those full regardless, so release coverage cannot become a docs run.
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          CI_RELEASE: ${{ inputs.release }}
        run: node scripts/ci-plan.ts "$BASE" "$HEAD"
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:docs
  static:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      # typecheck resolves the package's own `@jimhoyd/urlcode/*` self-imports
      # through the `types` in its exports map, which point into dist/. No
      # workspace build step precedes lint/typecheck/check:code: none of them
      # read packages/ui's generated stylesheets or any other workspace output
      # (packages/ui/src/styles.generated.ts and src/kit-styles.generated.ts
      # are ESLint-ignored and outside this job's own tsconfig `include`;
      # workspace typecheck/build runs in `workspace-verify` instead).
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      # Phase one of JS type-checking (allowJs/checkJs): build/release tooling
      # only (tsconfig.checkjs.json), not the 61 recipe/example .mjs files.
      # packages/auth/scripts pulls in packages/auth/src, which imports
      # @jimhoyd/urlcode-ui's types through its built dist/ exports map (the
      # same self-import resolution `npm run typecheck` above relies on for
      # `@jimhoyd/urlcode/*`), so the script itself builds ui first — see
      # `typecheck:tooling` in package.json.
      - run: npm run typecheck:tooling
      # `npm run check` stays complete for local use, but in CI the seven
      # documentation checks it contains already ran in the always-run `docs`
      # job on this same commit, so this lane runs only the remainder. The
      # sampled documentation checking is about two seconds; the point is not
      # to repeat work, not a meaningful wall-time saving.
      - run: npm run check:code
  # `npm test` alone, split into three `--test-shard` jobs per leg so it is off
  # the critical path of the ~6 minute serial Windows run. Each shard builds for
  # itself rather than sharing a dist/ artifact: the build is part of what the
  # per-Node/per-OS legs verify, and an artifact hop costs about what it saves.
  # Legs are per (os, node, shard); every one must pass for `verify-complete`.
  verify:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.coreChecks == 'true'
    strategy:
      fail-fast: false
      # Routine PR/main feedback is Linux Node 24; a pull request touching a
      # high-impact path (installer, manifests, release tooling, integration
      # cleanup, shared config; scripts/ci-plan.ts) adds Windows Node 24 shards.
      # Scheduled, merge-queue and manually dispatched exact-commit runs retain
      # the full OS x Node matrix.
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Same command and flags as `npm test`, plus the shard.
      # Through npm so npm_execpath is set, as it is for `npm test`; some tests read it.
      - run: npm run test:shard -- --test-shard=${{ matrix.shard }}/3 test/*.test.ts
  # Everything that is not the sharded suite. Package smoke runs only when a
  # changed path can affect the core archive. On Ubuntu Node 24 (every leg on
  # exact coverage), run starter/example tests, route audit and drills.
  checks:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.coreChecks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - if: matrix.full
        run: npm run test:examples:built
      - if: matrix.packageSmoke
        run: npm run test:package:built
      - if: matrix.full
        run: node dist/scripts/operational-drills.js
  # Every other leg's `setup-node` installs whatever the newest patch of its
  # major is, so nothing actually exercises the documented package floor
  # (`engines`: `>=22.13.0` on core and every first-party extension,
  # CONTRIBUTING.md/docs/INSTALL.md) itself: a regression that only breaks on
  # 22.13.0, not on a newer 22.x, would ship undetected. This leg pins that
  # exact version and packs/installs the real core tarball (`package-smoke.ts`,
  # the same check `checks` runs on newer Node) plus builds every extension
  # package, so both the archive a consumer installs and the workspaces a
  # contributor builds are proven at the floor, not just asserted in prose.
  package-floor-smoke:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.packageFloorSmoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Node's TypeScript type-stripping (what every `scripts/*.ts` entry point
    # here relies on) is on by default only from 22.18.0; 22.13.0 still has
    # it, but needs this flag explicitly, or every `.ts` invocation below
    # fails closed with ERR_UNKNOWN_FILE_EXTENSION. The published package
    # itself never executes .ts (ships plain dist/*.js), so this only
    # affects this leg's own build/audit tooling, not what a consumer runs.
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # devEngines.runtime pins a stricter floor for contributors than
      # engines.node's published package floor this leg exists to prove; npm
      # enforces devEngines unconditionally on any invocation in a directory
      # with this package.json, including setup-node's own internal `npm
      # config get cache` below, so it must be stripped before that step
      # runs, not just before `npm ci`. This leg's checkout only, never a
      # contributor's own `npm ci`.
      - run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devEngines;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The full package-smoke `urlcode test` call (#645): at the literal
      # 22.13.0 floor, `res.strictContentLength = true` (http-response.ts)
      # asked Node's own ERR_HTTP_CONTENT_LENGTH_MISMATCH self-check to
      # revalidate a Content-Length this runtime had already measured
      # correctly, and Node 22.13.0-22.14.x's self-check is itself broken —
      # it throws from a byte-for-byte-correct response, deterministically,
      # even on a single request on a fresh connection (not readiness.ts's
      # shared keep-alive socket, which was the original suspect: a minimal
      # repro outside this codebase failed the same way with no connection
      # reuse involved). contentLengthEnforcementIsSafe (server.ts) now
      # turns that redundant Node self-check off only on that narrow,
      # confirmed-broken range, so the full check is safe to run here again.
      - run: npm run test:package:built
      - run: node scripts/workspaces.ts run build
  # `verify --workspace <pkg>` (typecheck, build, test) for the five extension
  # packages, one package per job instead of the five run serially in one job.
  # `auth`'s own SQLite-backed suite alone was over half of the ~6-7 minute
  # serial windows-latest run; this puts it beside the others instead of after
  # them. Each job needs its own install and the root build, because a package
  # imports `@jimhoyd/urlcode`, the workspace-linked root package, through its
  # built `dist/`.
  workspace-verify:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.workspacePackages) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Shared runners (Windows in particular) have started the auth store
      # worker slowly (#339). Raises only the readiness budget, never lowers it.
      URLCODE_AUTH_STORE_STARTUP_MS: '60000'
      # Same shared-runner slowness can push the password-hash contention
      # queue's per-waiter wait past its default budget (#464/#506). Raises
      # only that budget, never lowers it.
      URLCODE_AUTH_HASH_WAIT_MS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # `admin` imports `auth` and `ui`; `auth`, `forms` and `store` import `ui`
      # (store contributes its CRUD screen to ui); `form-records` imports
      # `forms` and `store`. The matrix carries each
      # package's dependencies in build order (empty for `ui` and `mcp`, which
      # have none) so this job's own typecheck/build
      # can resolve them, the way the removed serial script did by ordering.
      - if: matrix.deps != ''
        shell: bash
        run: |
          set -euo pipefail
          for dep in ${{ matrix.deps }}; do npm run build --workspace @jimhoyd/urlcode-$dep; done
      - run: npm run verify --workspace @jimhoyd/urlcode-${{ matrix.package }}
  # Cross-package checks that need every workspace package already built:
  # the publish audit and the integration suite (init --with <ext>, which
  # symlinks the compiled companion packages). Kept out of `workspace-verify`
  # so that matrix stays one package per job; rebuilding four small packages
  # here is a few seconds, not the minutes their own test suites cost.
  workspace-integration:
    needs: [plan, workspace-verify]
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.workspaceIntegration == 'true'
    strategy:
      fail-fast: false
      # A release run (publish.yml calling this workflow with `release: true`)
      # and an explicit dispatch cover every supported OS on the default Node
      # runtime; a pull request touching a high-impact path runs the Linux
      # Node 24 leg (#744). Other routine runs skip it, and `verify-complete`
      # accepts that skip only when the plan did not select it.
      matrix: ${{ fromJSON(needs.plan.outputs.workspaceIntegrationMatrix) }}
    runs-on: ${{ matrix.os }}
    # Real npm installs of the packed runtime and every add-on, several sites per run; Windows is the slowest leg.
    timeout-minutes: 20
    env:
      URLCODE_AUTH_STORE_STARTUP_MS: '60000'
      URLCODE_AUTH_HASH_WAIT_MS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every add-on, in dependency order: the integration test packs each one.
      - run: node scripts/workspaces.ts run build
      - run: npm run audit:packages
      - run: npm run test:addons
      # Real-browser check of the CRUD screen (#332), on the Chrome that the
      # Linux runner image already carries: no new action or download. One leg
      # only; it is a step in this job, not a new required check.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        env:
          URLCODE_REQUIRE_BROWSER: '1'
        run: npm run test:browser --workspace @jimhoyd/urlcode-ui
  audit:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.coreChecks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'

  action:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.action == 'true'
    # The site action cannot run against this repository from a site's pull
    # request; exercise it on a site built from the packed runtime and add-ons
    # so a broken action.yml fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/workspaces.ts run build
      # Every add-on descriptor matches its code, and dist/addon-catalog.json matches the descriptors (#721).
      - run: node scripts/build-addon-manifest.ts --check
      # Sites built from the packed runtime and add-ons, pinned by sha512 exactly as a release pins them.
      - run: node scripts/pack-addons.ts "$RUNNER_TEMP/packed" --site "$RUNNER_TEMP/site" --with ui,store --example --ack store:public-write
      - run: node scripts/pack-addons.ts "$RUNNER_TEMP/packed-host" --site "$RUNNER_TEMP/host-site" --with mcp
      - name: Run the action on a site whose extensions are checked statically
        uses: ./action
        with:
          site: ${{ runner.temp }}/site
          compliance: baseline
          compliance-warn: true
          route-diff: false
      # mcp adds no routes, so this exercises host loading, the CI revision pin and activation without fixtures.
      - name: Run the action on a site through its host
        uses: ./action
        with:
          site: ${{ runner.temp }}/host-site
          host-file: host.mjs
          origin: https://site.example
          expect-routes: 0
          allow-empty-project: true
          compliance: baseline
          compliance-warn: true
          route-diff: false

  build-fidelity:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.buildFidelity == 'true'
    # dist/ is never committed: prove the build is deterministic, so a release
    # can be reproduced from its tagged commit and compared file by file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's own toolchain: publish.yml builds with .node-version too.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ci:build-fidelity

  verify-complete:
    # A skip is accepted only when the successful classifier required it.
    if: always()
    needs: [plan, docs, static, verify, checks, workspace-verify, workspace-integration, audit, action, build-fidelity, container, package-floor-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - name: Every planned check succeeded
        env:
          CI_PLAN: ${{ needs.plan.outputs.lane }}
          CI_WORKSPACE_INTEGRATION: ${{ needs.plan.outputs.workspaceIntegration }}
          CI_CORE_CHECKS: ${{ needs.plan.outputs.coreChecks }}
          CI_ACTION: ${{ needs.plan.outputs.action }}
          CI_BUILD_FIDELITY: ${{ needs.plan.outputs.buildFidelity }}
          CI_CONTAINER: ${{ needs.plan.outputs.container }}
          CI_PACKAGE_FLOOR_SMOKE: ${{ needs.plan.outputs.packageFloorSmoke }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.ts gate

  # Required check. The docs lane skips it: every prose path the classifier
  # admits is outside the image's build context (.dockerignore) and none of
  # the smoke tests read one. A job skipped by its own `if` reports success to
  # the required-check rule, and `verify-complete` accepts that skip only when
  # the successful plan selected the docs lane.
  container:
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f packaging/container/Dockerfile -t urlcode:test .
      - run: npm run ci:container-smoke
