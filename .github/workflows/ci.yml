name: verify
on:
  # A branch in this repository would otherwise run twice for one commit: once
  # for the push and again for the pull request, with different concurrency
  # groups so neither cancels the other. That doubled every job and, with a
  # small concurrent-macOS allowance, was what left macOS jobs queueing.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.ts "$BASE" "$HEAD"
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
  static:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run workspace:styles
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check
  verify:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      # Retain all supported Node versions; platform coverage remains on main.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request'
        && '{"os":["ubuntu-latest"],"node":["22","24","26"]}'
        || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["22","24","26"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js test --project starters/default
      - run: node dist/cli.js test --project examples/assets
      - run: node dist/cli.js test --project examples/cookbook
      - run: node dist/cli.js test --project examples/vercel
      - run: node dist/cli.js test --project examples/aws
      - run: node dist/cli.js test --project examples/cloudflare
      - run: node dist/cli.js build --target cloudflare --project examples/cloudflare --out examples/cloudflare/dist
      - run: node dist/cli.js audit --project examples/cookbook --expect-routes 40
      - run: npm run test:package:built
      - run: node dist/scripts/operational-drills.js
  workspaces:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    strategy:
      fail-fast: false
      # Retain all supported Node versions; platform coverage remains on main.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request'
        && '{"os":["ubuntu-latest"],"node":["22","24","26"]}'
        || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["22","24","26"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:workspaces
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'

  action:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    # The project action cannot run against this repository from a project's
    # pull request; exercise its steps against the cookbook with the packed
    # runtime so a broken action.yml fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          project: examples/cookbook
          runtime: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          expect-routes: 40
          compliance: baseline
          compliance-warn: true
          route-diff: false

  build-fidelity:
    needs: plan
    if: needs.plan.outputs.lane == 'full'
    # dist/ is never committed: prove the build is deterministic, so a release
    # can be reproduced from its tagged commit and compared file by file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build && cp -r dist first && npm run build && diff -r first dist
      # The release re-uploads assets over an existing release, which is only
      # safe if the tarball a re-run produces is the one already published.
      - name: npm pack is byte-reproducible at this commit
        run: |
          set -euo pipefail
          mkdir -p a b
          npm pack --ignore-scripts --pack-destination a >/dev/null
          npm pack --ignore-scripts --pack-destination b >/dev/null
          sha256sum a/*.tgz b/*.tgz
          cmp a/*.tgz b/*.tgz

  verify-complete:
    # A skip is accepted only when the successful classifier required it.
    if: always()
    needs: [plan, docs, static, verify, workspaces, audit, action, build-fidelity, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
      - name: Every planned check succeeded
        env:
          CI_PLAN: ${{ needs.plan.outputs.lane }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.ts gate

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t urlcode:test .
      - name: Smoke test bundled recipe and TypeScript authoring
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=700 \
            --entrypoint sh urlcode:test -ec '
              node /opt/urlcode/dist/cli.js recipes add typescript --out /tmp/source
              node /opt/urlcode/dist/cli.js build-typescript --project /tmp/source --out /tmp/built
              node /opt/urlcode/dist/cli.js validate --project /tmp/built
            '
      - name: Smoke test container health and redirect
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name urlcode -p 127.0.0.1:3000:3000 -v "$PWD/starters/default:/project:ro" urlcode:test
          trap 'docker logs urlcode; docker rm -f urlcode' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/_urlcode/ready; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go)" = 302
      - name: Smoke test isolated functions in constrained container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 -v "${{ github.workspace }}/examples/assets:/project:ro" urlcode:test test
