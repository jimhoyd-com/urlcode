name: verify
on:
  # A branch in this repository would otherwise run twice for one commit: once
  # for the push and again for the pull request, with different concurrency
  # groups so neither cancels the other. That doubled every job and, with a
  # small concurrent-macOS allowance, was what left macOS jobs queueing.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      # A pull request covers each axis once rather than the full cross
      # product: every supported Node on Linux, and one job on each other
      # platform. Node-version faults are largely platform-independent (SQLite
      # version skew shows everywhere) and platform faults are largely
      # version-independent (path case, symlinks, separators), so five jobs
      # catch what nine do for most changes. Pushes to main run all nine.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request'
        && '{"include":[{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"ubuntu-latest","node":"26"},{"os":"macos-latest","node":"22"},{"os":"windows-latest","node":"26"}]}'
        || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["22","24","26"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # verify builds before it tests, so dist/ is present for the steps below.
      - run: npm run verify
      - run: node dist/cli.js test --project starters/default
      - run: node dist/cli.js test --project examples/assets
      - run: node dist/cli.js test --project examples/cookbook
      - run: node dist/cli.js test --project examples/vercel
      - run: node dist/cli.js test --project examples/aws
      - run: node dist/cli.js test --project examples/cloudflare
      - run: node dist/cli.js build --target cloudflare --project examples/cloudflare --out examples/cloudflare/dist
      - run: node dist/cli.js audit --project examples/cookbook --expect-routes 40
      - run: npm run test:package
      - run: node dist/scripts/operational-drills.js
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      # Runtime advisories fail the build; development-only advisories are
      # reported without blocking, because they never ship to a deployment.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low || echo 'Development-only advisories reported; runtime tree is gated above'
      # The live-link suite skips itself on a Node build without the patched
      # SQLite. At least one job must actually run it, or the skip hides failures.
      - name: Live-link tests must not be silently skipped on every build
        run: node -e "import('./src/sqlite-version.ts').then(m=>{const ok=m.supportsConcurrentWal(process.versions.sqlite);console.log('sqlite',process.versions.sqlite,'live links',ok);process.exit(ok?0:1);})"
      - run: node --conditions=development --test test/links.test.ts

  action:
    # The project action cannot run against this repository from a project's
    # pull request; exercise its steps against the cookbook with the packed
    # runtime so a broken action.yml fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          project: examples/cookbook
          runtime: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          expect-routes: 40
          compliance: baseline
          compliance-warn: true
          route-diff: false

  build-fidelity:
    # dist/ is never committed: prove the build is deterministic, so a release
    # can be reproduced from its tagged commit and compared file by file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build && cp -r dist first && npm run build && diff -r first dist
      # The release re-uploads assets over an existing release, which is only
      # safe if the tarball a re-run produces is the one already published.
      - name: npm pack is byte-reproducible at this commit
        run: |
          set -euo pipefail
          mkdir -p a b
          npm pack --ignore-scripts --pack-destination a >/dev/null
          npm pack --ignore-scripts --pack-destination b >/dev/null
          sha256sum a/*.tgz b/*.tgz
          cmp a/*.tgz b/*.tgz

  verify-complete:
    # One stable name for the branch ruleset to require. The matrix above
    # deliberately changes shape between a pull request and main, so requiring
    # individual job names couples repository settings to the matrix and breaks
    # the next time it moves; this job's name never changes.
    #
    # It must run even when something upstream fails. A required check that is
    # skipped can be treated as satisfied, so a gate that inherits the default
    # `needs` behaviour would vanish exactly when a job it guards has failed.
    # `if: always()` keeps it running, and it then reports the failure itself.
    #
    # Checks from other workflows, such as CodeQL, are not reachable through
    # `needs` and stay separately required.
    if: always()
    needs: [verify, audit, action, build-fidelity, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this gate covers succeeded
        # Through env rather than interpolated into the script: expression
        # output never becomes shell source that way. Note the separator is
        # single-quoted, the only string form Actions expressions accept.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: $RESULTS"
          # An empty set would otherwise fall through the loop and pass.
          if [ -z "$RESULTS" ]; then
            echo "No upstream job results to check." >&2
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job reported '$result'." >&2
              exit 1
            fi
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t urlcode:test .
      - name: Smoke test bundled recipe and TypeScript authoring
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=700 \
            --entrypoint sh urlcode:test -ec '
              node /opt/urlcode/dist/cli.js recipes add typescript --out /tmp/source
              node /opt/urlcode/dist/cli.js build-typescript --project /tmp/source --out /tmp/built
              node /opt/urlcode/dist/cli.js validate --project /tmp/built
            '
      - name: Smoke test container health and redirect
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name urlcode -p 127.0.0.1:3000:3000 -v "$PWD/starters/default:/project:ro" urlcode:test
          trap 'docker logs urlcode; docker rm -f urlcode' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/_urlcode/ready; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/go)" = 302
      - name: Smoke test isolated functions in constrained container
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 -v "${{ github.workspace }}/examples/assets:/project:ro" urlcode:test test
      - name: Smoke test live links with an external writable store
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /state:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=700 \
            -v "$PWD/examples/live-links:/project:ro" --entrypoint sh urlcode:test -ec '
              node /opt/urlcode/dist/cli.js links create --store /state/links.sqlite --code demo --destination https://example.com/demo
              node /opt/urlcode/dist/cli.js test --link-store links=/state/links.sqlite
              node /opt/urlcode/dist/cli.js audit --link-store links=/state/links.sqlite --expect-routes 2
            '
      - name: Disposable volume-full and recovery drill
        shell: bash
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 768m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=700 \
            --tmpfs /state:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=700 \
            --entrypoint node urlcode:test \
            /opt/urlcode/dist/scripts/operational-drills.js --disk-full-dir /state
