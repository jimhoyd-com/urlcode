# Shared release contracts live in scripts/release.ts. Keep this filename for npm OIDC.
name: release-auth
on:
  push:
    tags:
      - "@jimhoyd/urlcode-auth@*"
permissions:
  contents: read
concurrency:
  group: urlcode-publication
  cancel-in-progress: false
env:
  PACKAGE_NAME: "@jimhoyd/urlcode-auth"
  PACKAGE_DIR: packages/auth
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate tag and manifest
        id: version
        run: node scripts/release.ts identity
      - name: Require exact green main commit and valid release state
        env: &a1
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts preflight
      - name: Promote verified candidate or restore original release bytes
        id: restore
        env: *a1
        run: node scripts/release.ts restore
      - name: Retain original release bytes
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.restore.outputs.name }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
      - name: Sign provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/*
      - name: Verify compatibility against published peer floors
        run: npm run release:peers
      - name: Publish to npm via trusted publishing
        if: vars.PUBLISH_NPM == 'true'
        env: *a1
        run: |-
          npm install --global --no-fund --no-audit npm@11.5.1
          npm run release:publish
      - name: Publish the GitHub release
        env: *a1
        run: node scripts/release.ts github
