name: Release — rehearsal: operator run (no publication)
# Manual only. Runs the release path's steps that ordinary CI does not reach, on any ref,
# and stops before signing, retaining, tagging or publishing anything. See
# docs/DEVELOPMENT-PIPELINE.md, "Release rehearsal".
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run rehearse:release
      - name: Run the candidate container steps (no signing, no artifact, no registry)
        env:
          URLCODE_CANDIDATE_RUN: ${{ github.run_id }}
          URLCODE_SOURCE_SHA: ${{ github.sha }}
          URLCODE_CHANNEL: candidate
        run: bash scripts/prepare-core-release.sh
