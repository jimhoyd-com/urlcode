name: signed build candidate
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: signed-build-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare with the same path as a core release
        env:
          URLCODE_SOURCE_SHA: ${{ github.sha }}
          URLCODE_CHANNEL: candidate
        run: bash scripts/prepare-core-release.sh
      - name: Sign provenance for package, SBOM and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/*
      - name: Retain candidate files (no registry publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
