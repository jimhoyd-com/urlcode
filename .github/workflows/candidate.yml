# Exact-commit evidence consumed by the tag-triggered core publication phase.
name: "Release — core: internal signed candidate"
run-name: "Release — core candidate for ${{ github.sha }}"
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: signed-build-candidate
  cancel-in-progress: false
jobs:
  candidate:
    name: Build, smoke-test, attest, and retain the candidate bytes
    if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/codex/release-validation/{0}', github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 1. Require source already merged to protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts candidate-source
      - name: 2. Build and verify the exact core npm candidate
        env:
          URLCODE_CANDIDATE_RUN: ${{ github.run_id }}
          URLCODE_SOURCE_SHA: ${{ github.sha }}
          URLCODE_CHANNEL: candidate
        run: bash scripts/prepare-core-release.sh
      - name: 3. Attest the archive, SBOM, and release manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/*
      - name: 4. Retain candidate files (no registry publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
