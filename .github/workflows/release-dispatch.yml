# Reusable orchestration phase. The release script owns the state machine; this
# workflow supplies the protected environment and narrowly scoped credentials.
name: "Release — core: op — internal coordinator"
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      consume_changesets:
        required: true
        type: boolean
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: release-coordinator
  cancel-in-progress: false
jobs:
  release:
    name: Coordinate release PR, exact-commit gates, and immutable tag
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 1. Require a manual dispatch from protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          # No npm cache: this job runs under the environment-scoped release
          # credential and must not restore a cache written by a less-privileged
          # workflow run.
      - run: npm ci --ignore-scripts
      - name: 2. Configure the identity that may create the release PR and tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |-
          test -n "$GH_TOKEN"
          gh auth setup-git
          git config user.name "urlcode-release"
          git config user.email "urlcode-release@users.noreply.github.com"
      # `release:run` creates/resumes the PR, waits for its required checks,
      # merges normally, dispatches full CI plus a signed candidate for the
      # exact merge commit, then creates the immutable tag. The tag-triggered
      # release workflow performs publication.
      - name: 3. Prepare PR, verify the exact merge commit, and create its tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          CONSUME_CHANGESETS: ${{ inputs.consume_changesets }}
        run: |-
          set -euo pipefail
          args=(--version "$RELEASE_VERSION" --execute)
          if [ "$CONSUME_CHANGESETS" = true ]; then args+=(--consume-changesets); fi
          npm run release:run -- "${args[@]}"
