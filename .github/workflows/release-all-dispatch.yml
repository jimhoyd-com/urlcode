name: release all packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact shared stable or alpha version
        required: true
        type: string
      consume_changesets:
        description: Consume all pending Changesets
        required: true
        default: true
        type: boolean
jobs:
  release:
    uses: ./.github/workflows/release-dispatch.yml
    with:
      package: all
      version: ${{ inputs.version }}
      consume_changesets: ${{ inputs.consume_changesets }}
    secrets:
      RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
