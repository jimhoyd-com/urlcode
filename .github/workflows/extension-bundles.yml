name: publish extension bundles
on:
  push:
    tags:
      - extension-bundles@v*
permissions:
  contents: read
jobs:
  publish:
    # This approval boundary is intentionally separate from core/package
    # publication: its assets contain trusted executable operator code.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Build frozen bundle archives from the immutable tagged source
        run: |-
          set -euo pipefail
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --disable-warning=ExperimentalWarning scripts/prepare-extension-bundles.ts \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/urlcode-extension-bundles"
      - name: Require the generated catalog pin, digests and complete inventory
        run: |-
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import {createHash} from "node:crypto";
            const dir=process.env.RUNNER_TEMP+"/urlcode-extension-bundles";
            const c=JSON.parse(fs.readFileSync(dir+"/extension-bundles-catalog.json","utf8"));
            if(c.format!==1 || c.tag!==process.env.GITHUB_REF_NAME || c.commit!==process.env.GITHUB_SHA || !Array.isArray(c.bundles) || !Array.isArray(c.revoked)) process.exit(1);
            const names=new Set(), assets=new Set();
            for(const b of c.bundles) {
              if(!/^[a-z][a-z0-9-]{0,63}$/.test(b.name) || names.has(b.name) || !/^[a-f0-9]{64}$/.test(b.sha256) || !/^[A-Za-z0-9._-]+\.tgz$/.test(b.asset) || assets.has(b.asset)) process.exit(1);
              names.add(b.name); assets.add(b.asset);
              const bytes=fs.readFileSync(dir+"/"+b.asset);
              if(createHash("sha256").update(bytes).digest("hex")!==b.sha256) process.exit(1);
            }
            const present=fs.readdirSync(dir).filter(file=>file.endsWith(".tgz"));
            if(present.length!==assets.size || present.some(file=>!assets.has(file))) process.exit(1);
          '
      - name: Require only regular frozen module-tree members
        run: |-
          set -euo pipefail
          for archive in "$RUNNER_TEMP/urlcode-extension-bundles"/*.tgz; do
            tar -tzf "$archive" | grep -qx 'bundle.json'
            if tar -tvzf "$archive" | awk 'substr($0,1,1)!="-" {exit 1}'; then :; else
              echo "Bundle contains a non-regular member: $archive" >&2
              exit 1
            fi
            if tar -tzf "$archive" | grep -Eqv '^(bundle\.json|node_modules/.+)$'; then
              echo "Bundle contains a member outside its frozen module tree: $archive" >&2
              exit 1
            fi
          done
      - name: Attest catalog and bundle archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-extension-bundles/extension-bundles-catalog.json
      - name: Attest each bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-extension-bundles/*.tgz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/urlcode-extension-bundles/extension-bundles-catalog.json" "$RUNNER_TEMP/urlcode-extension-bundles"/*.tgz --title "$GITHUB_REF_NAME" --verify-tag
