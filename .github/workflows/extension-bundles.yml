name: "Release: extensions: op bundles"
on:
  push:
    tags:
      - extension-bundles@v*
  workflow_dispatch:
    inputs:
      version:
        description: Exact new extension bundle version (for example 0.5.2)
        required: true
        type: string
permissions:
  contents: read
jobs:
  tag:
    # A run dispatched from main only creates (or resumes) the immutable tag,
    # then dispatches this workflow again on that tag. Build and attestation
    # must run on refs/tags/<release>: the Sigstore certificate records the
    # run's own ref, and the CLI verifies --source-ref refs/tags/<release>, so
    # an attestation signed by a run on refs/heads/main can never be installed
    # (#579). A workflow_dispatch made with GITHUB_TOKEN does start a new run.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    environment: release
    concurrency:
      group: extension-bundles-tag-${{ inputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A successful run takes a minute or two; the environment approval wait
    # happens before the job starts and does not count against this.
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create or resume the immutable bundle release tag, then build from it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts tag
  publish:
    # This approval boundary is intentionally separate from core/package
    # publication: its assets contain trusted executable operator code.
    # It runs only on a tag ref (a tag push, or the dispatch made by the tag
    # job above), so the provenance names refs/tags/<release>.
    if: github.ref_type == 'tag'
    environment: release
    concurrency:
      group: extension-bundles-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A successful run takes a few minutes, including the added CLI-policy
    # verification before and after publishing; the environment approval
    # wait happens before the job starts and does not count against this.
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Select the tagged release source
        id: source
        env:
          VERSION: ${{ inputs.version }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts source
      - name: Build frozen bundle archives from the immutable tagged source
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts build
      - name: Require the generated catalog pin, digests and complete inventory
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts inventory
      - name: Require only regular frozen module-tree members
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts archives
      - name: Attest catalog and bundle archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-extension-bundles/extension-bundles-catalog.json
      - name: Attest each bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-extension-bundles/*.tgz
      - name: Refuse to publish what the CLI would refuse to install
        # The same transport as `urlcode init --with` and `extension-bundles
        # install`: signer workflow, --source-ref refs/tags/<release>, catalog,
        # core pin and archive checks (#579).
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts verify-local
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts publish
      - name: Verify the published release with the CLI policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node --disable-warning=ExperimentalWarning scripts/extension-bundle-release.ts verify-published
