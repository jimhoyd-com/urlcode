# Temporary: interactive debugging for https://github.com/jimhoyd-com/urlcode/issues/768
# (audit test files hang on windows-latest Node 22). Delete this workflow once #768 is closed.
name: Debug windows audit hang
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        with:
          limit-access-to-actor: true
