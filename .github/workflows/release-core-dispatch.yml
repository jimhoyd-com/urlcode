# The maintainer-facing entrypoint. It does not publish directly: the
# coordinator prepares and merges the release PR, proves the merged commit, and
# creates the immutable v* tag. release.yml publishes only after that tag push.
name: Core release — prepare, verify, tag
run-name: Core release ${{ inputs.version }} — prepare, verify, tag
# Least privilege: this caller only dispatches the reusable coordinator
# workflow below, which declares and grants its own job-level permissions
# (release-dispatch.yml). The default GITHUB_TOKEN here needs nothing.
permissions: {}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new stable or alpha version (for example 0.5.4 or 0.6.0-alpha.1)
        required: true
        type: string
      consume_changesets:
        description: Apply pending Changesets targeting core in the release PR
        required: true
        default: true
        type: boolean
jobs:
  release:
    name: Prepare release PR, prove its merge commit, and create the v* tag
    uses: ./.github/workflows/release-dispatch.yml
    with:
      package: core
      version: ${{ inputs.version }}
      consume_changesets: ${{ inputs.consume_changesets }}
    secrets:
      RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
