# The maintainer-facing core coordinator. It does not publish directly: it
# prepares and merges the release PR, proves the merged commit, and creates the
# immutable v* tag. release.yml publishes only after that tag push.
name: "Release: core: op start"
run-name: "Release: core ${{ inputs.version }}: op start"
permissions:
  contents: read
concurrency:
  group: release-coordinator
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new stable or alpha version (for example 0.5.4 or 0.6.0-alpha.1)
        required: true
        type: string
      consume_changesets:
        description: Apply pending Changesets targeting core in the release PR
        required: true
        default: true
        type: boolean
jobs:
  release:
    name: Coordinate release PR, exact-commit gates, and immutable tag
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 1. Require a manual dispatch from protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # This coordinator never builds the package itself: it dispatches
      # candidate.yml and full CI, then tags the result. Node 22 is only the
      # orchestration runtime for release.ts/gh (22.18+ needed for
      # type-stripped TypeScript, satisfied by any current 22.x). See
      # candidate.yml for why the candidate archive is built inside a pinned
      # Node 26 container.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: 2. Configure the identity that may create the release PR and tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |-
          test -n "$GH_TOKEN"
          gh auth setup-git
          git config user.name "urlcode-release"
          git config user.email "urlcode-release@users.noreply.github.com"
      # `release:run` creates/resumes the PR, waits for its required checks,
      # merges normally, dispatches full CI plus a signed candidate for the
      # exact merge commit, then creates the immutable tag. The tag-triggered
      # release workflow performs publication.
      - name: 3. Prepare PR, verify the exact merge commit, and create its tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          CONSUME_CHANGESETS: ${{ inputs.consume_changesets }}
        run: |-
          set -euo pipefail
          args=(--version "$RELEASE_VERSION" --execute)
          if [ "$CONSUME_CHANGESETS" = true ]; then args+=(--consume-changesets); fi
          npm run release:run -- "${args[@]}"
