name: "Release: extensions: op artifacts"
on:
  push:
    tags:
      - extensions@v*
permissions:
  contents: read
jobs:
  publish:
    # The environment is an approval boundary; the job's identity is bound to
    # this repository, this workflow, and the immutable pushed tag/commit.
    environment: release
    # One publication per tag at a time; a second push of the same tag waits
    # rather than racing the first to create the release.
    concurrency:
      group: artifacts-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A successful run takes a minute or two; the environment approval wait
    # happens before the job starts and does not count against this.
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Build catalog and artifacts from the immutable tagged source
        run: |-
          set -euo pipefail
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --disable-warning=ExperimentalWarning scripts/prepare-artifacts.ts \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/urlcode-artifacts"
      - name: Require the generated catalog pin and complete asset inventory
        run: |-
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const dir=process.env.RUNNER_TEMP+"/urlcode-artifacts";
            const c=JSON.parse(fs.readFileSync(dir+"/extensions-catalog.json","utf8"));
            if(c.format!==1 || c.tag!==process.env.GITHUB_REF_NAME || c.commit!==process.env.GITHUB_SHA) process.exit(1);
            if(!Array.isArray(c.artifacts)||!Array.isArray(c.revoked)) process.exit(1);
            for(const a of c.artifacts) {
              if(a.kind!=="declarative" || !/^[a-f0-9]{64}$/.test(a.sha256) || !/^[A-Za-z0-9._-]+\.tgz$/.test(a.asset)) process.exit(1);
              const bytes=fs.readFileSync(dir+"/"+a.asset);
              const actual=(await import("node:crypto")).createHash("sha256").update(bytes).digest("hex");
              if(actual!==a.sha256) process.exit(1);
            }
            const listed=new Set(c.artifacts.map(a=>a.asset));
            const present=fs.readdirSync(dir).filter(f=>f.endsWith(".tgz"));
            if(listed.size!==present.length || present.some(f=>!listed.has(f))) process.exit(1);
          '
      - name: Refuse executable artifact contents
        run: |-
          set -euo pipefail
          for archive in "$RUNNER_TEMP/urlcode-artifacts"/*.tgz; do
            if tar -tzf "$archive" | grep -Eqv '^(extension\.json|README\.md|schemas/[A-Za-z0-9._-]+\.json|config/[A-Za-z0-9._-]+\.json)$'; then
              echo "Executable or unsupported member in $archive" >&2
              exit 1
            fi
            tar -tzf "$archive" | grep -qx 'extension\.json'
          done
      - name: Attest catalog and artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-artifacts/extensions-catalog.json
      - name: Attest each artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/urlcode-artifacts/*.tgz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/urlcode-artifacts/extensions-catalog.json" "$RUNNER_TEMP/urlcode-artifacts"/*.tgz --title "$GITHUB_REF_NAME" --verify-tag
