# Validates, tests and audits this project on every push and pull request, and
# comments a route-inventory diff on pull requests. See
# https://github.com/jimhoyd-com/urlcode/blob/main/docs/CI.md
name: urlcode
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: write # the sticky route-diff comment; drop it to only log the diff
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tag of the runtime that generated this project; the action installs that exact version.
      # Move it deliberately when you upgrade (a commit SHA pins harder; @main installs an unpinned runtime).
      - uses: jimhoyd-com/urlcode/action@v0.5.9
        with:
          expect-routes: 0 # update when adding or removing routes
          allow-empty-project: true # remove after adding the first active route
          compliance: baseline
